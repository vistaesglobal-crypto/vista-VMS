        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 480;
        const scale = MAX_WIDTH / (video.videoWidth || 640);
        canvas.width = MAX_WIDTH;
        canvas.height = (video.videoHeight || 480) * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const compressedData = canvas.toDataURL('image/webp', 0.68);

                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-sm">Pre-Register Guest / Visitor</h3>
                  <button onClick={() => setShowPreRegModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handlePreRegSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-medium text-slate-300 mb-1">Guest Full Name *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Dr. Aravind Swamy"
                      value={preRegForm.fullName}
                      onChange={(e) => setPreRegForm({ ...preRegForm, fullName: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-medium text-slate-300 mb-1">Phone Number *</label>
                      <input
                        type="tel"
                        required
                        placeholder="+91 98000 12345"
                        value={preRegForm.phone}
                        onChange={(e) => setPreRegForm({ ...preRegForm, phone: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500"
                      />
                    </div>
                    <div>
                      <label className="block font-medium text-slate-300 mb-1">Company</label>
                      <input
                        type="text"
                        placeholder="Company / Org"
                        value={preRegForm.company}
                        onChange={(e) => setPreRegForm({ ...preRegForm, company: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-medium text-slate-300 mb-1">Category</label>
                      <select
                        value={preRegForm.category}
                        onChange={(e) => setPreRegForm({ ...preRegForm, category: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500"
                      >
                        <option>VIP Guest</option>
                        <option>Client</option>
                        <option>Auditor</option>
                        <option>Interviewee</option>
                        <option>Vendor/Supplier</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-medium text-slate-300 mb-1">Vehicle License #</label>
                      <input
                        type="text"
                        placeholder="TN-37-AB-0000"
                        value={preRegForm.vehicleNumber}
                        onChange={(e) => setPreRegForm({ ...preRegForm, vehicleNumber: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-medium text-slate-300 mb-1">Host Staff Member (Cleaned Roster)</label>
                    <select
                      value={preRegForm.hostEmpId}
                      onChange={(e) => setPreRegForm({ ...preRegForm, hostEmpId: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500"
                    >
                      {employees.map(emp => (
                        <option key={emp.id} value={emp.employeeId}>
                          {emp.name} ({emp.department})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block font-medium text-slate-300 mb-1">Purpose of Visit</label>
                    <input
                      type="text"
                      value={preRegForm.purpose}
                      onChange={(e) => setPreRegForm({ ...preRegForm, purpose: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div className="pt-2 flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowPreRegModal(false)}
                      className="w-1/3 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-medium"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="w-2/3 bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-xl shadow"
                    >
                      Dispatch Digital Pass
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Interactive QR Pass Viewer */}
          {}
          {showQrModal && qrModalVisitor && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-950 border border-sky-800/80 rounded-3xl max-w-sm w-full p-6 shadow-2xl relative overflow-hidden flex flex-col items-center">
                
                <button
                  onClick={() => setShowQrModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-900 p-2 rounded-full border border-slate-800 transition"
                  aria-label="Close"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>

                <div className="text-center w-full pb-3 border-b border-slate-800/80 flex flex-col items-center">
                  <VistaLogo height="h-8" containerClass="mb-1.5 shadow" />
                  <h3 className="font-bold text-white text-sm">VISTA Engg Solutions Pvt Ltd</h3>
                  <span className="text-[10px] text-sky-400 font-semibold tracking-wider uppercase">Official Visitor Gate Pass</span>
                </div>

                <div className="w-full flex items-center gap-3 my-4 bg-slate-900/90 p-3 rounded-2xl border border-slate-800">
                  <img
                    src={qrModalVisitor.photo}
                    alt={qrModalVisitor.fullName}
                    className="w-14 h-14 rounded-xl object-cover border-2 border-sky-500 shadow"
                  />
                  <div className="flex-1 overflow-hidden">
                    <span className="font-bold text-white text-sm block truncate">{qrModalVisitor.fullName}</span>
                    <span className="text-[11px] text-slate-400 block">{qrModalVisitor.company} • {qrModalVisitor.category}</span>
                    <span className="text-[10px] text-emerald-400 font-mono font-bold block mt-0.5">
                      Badge: {qrModalVisitor.badgeNumber}
                    </span>
                  </div>
                </div>

                <div className="bg-white p-4 rounded-2xl shadow-xl border-4 border-sky-500/20 flex flex-col items-center justify-center relative">
                  <div id="interactive-qr-container" className="flex items-center justify-center"></div>
                  <div className="mt-2 text-center">
                    <span className="font-mono font-bold text-xs text-slate-900 block bg-slate-100 px-2.5 py-0.5 rounded">
                      {qrModalVisitor.qrToken}
                    </span>
                    <span className="text-[10px] text-slate-500 font-medium block mt-0.5">
                      Point phone camera or barcode gun to scan
                    </span>
                  </div>
                </div>

                <div className="w-full bg-slate-900/60 p-2.5 rounded-xl border border-slate-800 text-[11px] mt-4 space-y-1">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Designated Host:</span>
                    <span className="font-semibold text-slate-200">{qrModalVisitor.hostName}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Department:</span>
                    <span className="text-sky-300 font-medium">{qrModalVisitor.department}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Current Status:</span>
                    <span className={`font-bold ${qrModalVisitor.status === 'Checked-In' ? 'text-emerald-400' : 'text-amber-400'}`}>
                      {qrModalVisitor.status}
                    </span>
                  </div>
                </div>

                <div className="w-full flex gap-2 mt-4">
                  <button
                    onClick={() => {
                      setViewMode('internal');
                      setActiveTab('scan');
                      setScannedInput(qrModalVisitor.qrToken);
                      handleTokenVerify(qrModalVisitor.qrToken);
                      setShowQrModal(false);
                      showToast('SIMULATED GATE SCAN', `Scanned pass for ${qrModalVisitor.fullName}`);
                    }}
                    className="flex-1 bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow"
                  >
                    <i data-lucide="scan" className="w-3.5 h-3.5"></i>
                    <span>Test In Gate Scanner</span>
                  </button>
                  <button
                    onClick={() => {
                      const nextIndex = (visits.findIndex(v => v.id === qrModalVisitor.id) + 1) % visits.length;
                      setQrModalVisitor(visits[nextIndex]);
                    }}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-1 border border-slate-700"
                    title="Switch to next visitor pass"
                  >
                    <i data-lucide="skip-forward" className="w-3.5 h-3.5"></i>
                    <span>Next Pass</span>
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Modal: Entrance Gate Standee QR Code */}
          {}
          {showStandeeModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-950 border border-sky-800/80 rounded-3xl max-w-sm w-full p-6 shadow-2xl relative flex flex-col items-center text-center">
                <button
                  onClick={() => setShowStandeeModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-900 p-2 rounded-full border border-slate-800 transition"
                  aria-label="Close"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>

                <div className="flex justify-center mb-2">
                  <VistaLogo height="h-12" containerClass="shadow-xl" />
                </div>
                <h3 className="font-bold text-white text-base">VISTA Engg Solutions Pvt Ltd</h3>
                <span className="text-xs text-sky-400 font-semibold">Security Gate Registration Standee</span>

                <div className="bg-white p-4 rounded-2xl shadow-2xl border-4 border-sky-500/20 my-4 flex items-center justify-center">
                  <div id="standee-qr-target"></div>
                </div>

                <p className="text-xs text-slate-300">
                  Scan this QR code using your phone camera at reception or gate to self-register.
                </p>

                <div className="w-full pt-4 mt-2 border-t border-slate-800 flex gap-2">
                  <button
                    onClick={() => window.print()}
                    className="flex-1 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-xs font-semibold text-slate-200 flex items-center justify-center gap-1.5"
                  >
                    <i data-lucide="printer" className="w-3.5 h-3.5"></i>
                    <span>Print Standee</span>
                  </button>
                  <button
                    onClick={() => {
                      setViewMode('public');
                      setRegStep(1);
                      setShowStandeeModal(false);
                    }}
                    className="flex-1 bg-sky-600 hover:bg-sky-500 py-2.5 rounded-xl text-xs font-semibold text-white flex items-center justify-center gap-1.5"
                  >
                    <i data-lucide="smartphone" className="w-3.5 h-3.5"></i>
                    <span>Open Form</span>
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
