<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VISTA Visitor Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f8fafc; }
    .glass-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .vista-logo-frame { aspect-ratio: 16 / 10; display: inline-flex; align-items: center; justify-content: center; background: #ffffff; padding: 6px 12px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
  </style>
</head>
<body class="min-h-screen text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Official VISTA Vector Logo (Aspect-Locked, Offline Native SVG)
    const VistaLogo = ({ className = "h-9" }) => (
      <div className={`vista-logo-frame ${className}`}>
        <svg viewBox="0 0 480 300" className="w-full h-full object-contain" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(15, 10)">
            {/* Spiral dot accents */}
            <circle cx="115" cy="22" r="6" fill="#9d174d"/>
            <circle cx="95" cy="28" r="7" fill="#be185d"/>
            <circle cx="78" cy="38" r="8" fill="#db2777"/>
            <circle cx="64" cy="52" r="9" fill="#c026d3"/>
            <circle cx="53" cy="70" r="9.5" fill="#a855f7"/>
            <circle cx="46" cy="92" r="10" fill="#9333ea"/>
            <circle cx="43" cy="116" r="10.5" fill="#7e22ce"/>
            <circle cx="44" cy="142" r="10.5" fill="#6b21a8"/>
            <circle cx="51" cy="168" r="10" fill="#581c87"/>
            <circle cx="63" cy="192" r="9.5" fill="#4c1d95"/>
            <circle cx="79" cy="214" r="9" fill="#3b0764"/>
            <circle cx="140" cy="28" r="5.5" fill="#be185d"/>
            <circle cx="120" cy="36" r="6.5" fill="#db2777"/>
            <circle cx="103" cy="48" r="7.5" fill="#c026d3"/>
            <circle cx="89" cy="64" r="8.5" fill="#9333ea"/>
            <circle cx="79" cy="84" r="9" fill="#7c3aed"/>
            <circle cx="73" cy="106" r="9.5" fill="#6366f1"/>
            <circle cx="72" cy="130" r="9.5" fill="#4f46e5"/>
            <circle cx="76" cy="154" r="9.5" fill="#4338ca"/>
            <circle cx="85" cy="176" r="9" fill="#3730a3"/>
            <circle cx="99" cy="196" r="8.5" fill="#312e81"/>
            <circle cx="165" cy="40" r="5" fill="#db2777"/>
            <circle cx="145" cy="50" r="6" fill="#c026d3"/>
            <circle cx="127" cy="64" r="7" fill="#8b5cf6"/>
            <circle cx="112" cy="82" r="8" fill="#6366f1"/>
            <circle cx="102" cy="102" r="8.5" fill="#3b82f6"/>
            <circle cx="98" cy="124" r="8.5" fill="#2563eb"/>
            <circle cx="100" cy="146" r="8.5" fill="#1d4ed8"/>
            <circle cx="108" cy="166" r="8" fill="#1e40af"/>
            <circle cx="121" cy="184" r="7.5" fill="#1e3a8a"/>
            <circle cx="190" cy="60" r="4.5" fill="#a855f7"/>
            <circle cx="170" cy="72" r="5.5" fill="#818cf8"/>
            <circle cx="152" cy="88" r="6.5" fill="#38bdf8"/>
            <circle cx="137" cy="108" r="7" fill="#0ea5e9"/>
            <circle cx="128" cy="128" r="7.5" fill="#0284c7"/>
            <circle cx="126" cy="148" r="7.5" fill="#0369a1"/>
            <circle cx="132" cy="166" r="7" fill="#075985"/>
            <circle cx="215" cy="85" r="4" fill="#6366f1"/>
            <circle cx="195" cy="98" r="5" fill="#38bdf8"/>
            <circle cx="177" cy="115" r="6" fill="#06b6d4"/>
            <circle cx="162" cy="134" r="6.5" fill="#0891b2"/>
            <circle cx="154" cy="152" r="6.5" fill="#0e7490"/>
            <circle cx="238" cy="115" r="3.5" fill="#06b6d4"/>
            <circle cx="218" cy="128" r="4.5" fill="#14b8a6"/>
            <circle cx="199" cy="143" r="5.5" fill="#0d9488"/>
            <circle cx="184" cy="159" r="6" fill="#0f766e"/>
            <circle cx="258" cy="148" r="3.5" fill="#10b981"/>
            <circle cx="238" cy="160" r="4.5" fill="#059669"/>
            <circle cx="218" cy="172" r="5" fill="#047857"/>
            <circle cx="272" cy="182" r="3" fill="#10b981"/>
            <circle cx="252" cy="192" r="4" fill="#059669"/>
            <circle cx="282" cy="216" r="3" fill="#059669"/>
            <circle cx="318" cy="222" r="2.5" fill="#047857"/>
            <circle cx="352" cy="226" r="2" fill="#065f46"/>
          </g>
          {/* VISTA typography */}
          <text x="150" y="152" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="900" fontSize="98" fill="#111c4e" letterSpacing="0">VISTA</text>
          <text x="408" y="92" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="800" fontSize="22" fill="#111c4e">TM</text>
          <text x="290" y="214" textAnchor="middle" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="600" fontSize="32" fill="#0f172a" letterSpacing="1.5">Innovation @ work</text>
        </svg>
      </div>
    );

    // Official 7 Host Personnel Directory (Zero contact phones or emails displayed)
    const OFFICIAL_EMPLOYEES = [
      { id: "VES-0101", name: "Magesh Kumar S", dept: "Indian Operations", role: "Head - Operations", access: "Management / Host", status: "Active" },
      { id: "VES-0102", name: "Mohan D", dept: "Operations", role: "Operations Lead", access: "Management / Host", status: "Active" },
      { id: "VES-0103", name: "Hariprasath", dept: "Frontdesk / Reception", role: "Frontdesk / Reception", access: "Frontdesk / Reception", status: "Active" },
      { id: "VES-0104", name: "Pradeepa M", dept: "HR & Talent Acquisition", role: "Recruiter", access: "Host", status: "Active" },
      { id: "VES-0105", name: "Sakthi Nathan M", dept: "HR & Talent Acquisition", role: "Recruiter", access: "Host", status: "Active" },
      { id: "VES-0106", name: "Naveen Kumar", dept: "Engineering & Projects", role: "Project Manager", access: "Host", status: "Active" },
      { id: "VES-0107", name: "Keerthivasan D", dept: "Engineering & Projects", role: "Project Manager", access: "Host", status: "Active" }
    ];

    function App() {
      const queryParams = new URLSearchParams(window.location.search);
      const isVisitorMode = queryParams.get('mode') === 'visitor' || !queryParams.get('portal');
      
      const [view, setView] = useState(isVisitorMode ? 'visitor' : 'staff');
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      
      // Login form state
      const [loginId, setLoginId] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      // Public visitor registration state
      const [step, setStep] = useState(1);
      const [formData, setFormData] = useState({
        fullName: '', phone: '', email: '', company: '', govtIdLast4: '',
        hostId: 'VES-0103', purpose: 'Business Meeting', vehicleNo: '', assetDetails: '', photo: ''
      });
      const [registeredBadge, setRegisteredBadge] = useState(null);

      // System records
      const [visitors, setVisitors] = useState([
        { id: "VIS-9401", name: "Karthikeyan R", phone: "9876543210", host: "Magesh Kumar S", dept: "Indian Operations", purpose: "Vendor Meeting", status: "Inside", checkIn: "10:15 AM", checkOut: "-" },
        { id: "VIS-9402", name: "Ananya Sharma", phone: "9845012345", host: "Mohan D", dept: "Operations", purpose: "Client Discussion", status: "Inside", checkIn: "10:45 AM", checkOut: "-" },
        { id: "VIS-9403", name: "Venkatesh Rao", phone: "9731098765", host: "Hariprasath", dept: "Frontdesk / Reception", purpose: "Facility Audit", status: "Inside", checkIn: "11:00 AM", checkOut: "-" }
      ]);

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const id = loginId.trim().toLowerCase();
        const pass = loginPass.trim();

        if (id === 'superuser' && pass === 'vista@super') {
          setCurrentUser({ name: "Super User", role: "Super User / Executive Access", level: "super" });
        } else if (id === 'admin' && pass === 'vista@admin') {
          setCurrentUser({ name: "System Admin", role: "System Administrator", level: "admin" });
        } else if (id === 'frontdesk' && pass === 'vista@gate') {
          setCurrentUser({ name: "Front Desk Officer", role: "Front Desk & Security", level: "frontdesk" });
        } else {
          setLoginError('Invalid Username or Password. Please contact system administrator.');
        }
      };

      const handleVisitorSubmit = (e) => {
        e.preventDefault();
        const hostObj = OFFICIAL_EMPLOYEES.find(e => e.id === formData.hostId) || OFFICIAL_EMPLOYEES[2];
        const newBadge = {
          id: `VIS-${Math.floor(1000 + Math.random() * 9000)}`,
          name: formData.fullName,
          phone: formData.phone,
          host: hostObj.name,
          dept: hostObj.dept,
          purpose: formData.purpose,
          status: "Inside",
          checkIn: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          checkOut: "-"
        };
        setVisitors([newBadge, ...visitors]);
        setRegisteredBadge(newBadge);
        setStep(5);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Bar: Hidden when in strictly isolated visitor mode */}
          {!isVisitorMode && (
            <header className="border-b border-slate-800 bg-slate-900/90 px-6 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <VistaLogo className="h-9" />
                <div>
                  <h1 className="font-bold text-white text-base leading-tight">VISTA Engg Solutions Private Limited</h1>
                  <p className="text-xs text-cyan-400 font-medium">Visitor Management System</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setView('visitor')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${view === 'visitor' ? 'bg-cyan-500 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                >
                  Visitor Form Flow
                </button>
                <button 
                  onClick={() => setView('staff')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${view === 'staff' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                >
                  Staff Portal
                </button>
              </div>
            </header>
          )}

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 flex flex-col justify-center items-center p-4">
            
            {/* 1. VISITOR SELF-REGISTRATION KIOSK */}
            {view === 'visitor' && (
              <div className="w-full max-w-lg glass-card rounded-2xl p-6 sm:p-8 shadow-2xl border border-slate-800">
                <div className="flex justify-center mb-6">
                  <VistaLogo className="h-14" />
                </div>

                {step === 1 && (
                  <div className="text-center">
                    <h2 className="text-2xl font-bold text-white mb-2">Welcome to VISTA Campus</h2>
                    <p className="text-sm text-slate-400 mb-6">Please complete self-registration to receive your touchless visitor badge.</p>
                    
                    <div className="grid grid-cols-2 gap-4 mb-6">
                      <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
                        <div className="text-xs text-slate-400 uppercase font-semibold">Total Campus Footfall</div>
                        <div className="text-2xl font-bold text-white mt-1">12,845</div>
                      </div>
                      <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
                        <div className="text-xs text-slate-400 uppercase font-semibold">Today's Sequence #</div>
                        <div className="text-2xl font-bold text-cyan-400 mt-1">#28</div>
                      </div>
                    </div>

                    <button 
                      onClick={() => setStep(2)}
                      className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold rounded-xl shadow-lg transition"
                    >
                      Register for Visit &rarr;
                    </button>
                  </div>
                )}

                {step === 2 && (
                  <form onSubmit={(e) => { e.preventDefault(); setStep(3); }}>
                    <h3 className="text-lg font-bold text-white mb-1">Step 1: Contact Details</h3>
                    <p className="text-xs text-slate-400 mb-4">Enter your details for campus security verification.</p>

                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Full Name *</label>
                        <input 
                          type="text" required
                          value={formData.fullName} 
                          onChange={(e) => setFormData({...formData, fullName: e.target.value})}
                          placeholder="e.g. Anand Kumar" 
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Mobile Number *</label>
                        <input 
                          type="tel" required
                          value={formData.phone} 
                          onChange={(e) => setFormData({...formData, phone: e.target.value})}
                          placeholder="10-digit mobile number" 
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Govt ID Last 4 Digits (Aadhaar / DL) *</label>
                        <input 
                          type="text" required maxLength="4"
                          value={formData.govtIdLast4} 
                          onChange={(e) => setFormData({...formData, govtIdLast4: e.target.value})}
                          placeholder="e.g. 5421" 
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none"
                        />
                      </div>
                    </div>

                    <div className="flex gap-3 mt-6">
                      <button type="button" onClick={() => setStep(1)} className="w-1/3 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-semibold text-sm hover:bg-slate-700">Back</button>
                      <button type="submit" className="w-2/3 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-white font-bold rounded-xl text-sm transition">Continue &rarr;</button>
                    </div>
                  </form>
                )}

                {step === 3 && (
                  <form onSubmit={handleVisitorSubmit}>
                    <h3 className="text-lg font-bold text-white mb-1">Step 2: Host & Visit Purpose</h3>
                    <p className="text-xs text-slate-400 mb-4">Select the designated employee you are visiting today.</p>

                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Host Personnel *</label>
                        <select 
                          value={formData.hostId} 
                          onChange={(e) => setFormData({...formData, hostId: e.target.value})}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none"
                        >
                          {OFFICIAL_EMPLOYEES.map(emp => (
                            <option key={emp.id} value={emp.id}>{emp.name} — {emp.dept} ({emp.role})</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Purpose of Visit *</label>
                        <select 
                          value={formData.purpose} 
                          onChange={(e) => setFormData({...formData, purpose: e.target.value})}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none"
                        >
                          <option value="Business Meeting">Business Meeting</option>
                          <option value="Interview / Recruitment">Interview / Recruitment</option>
                          <option value="Vendor / Supplier Discussion">Vendor / Supplier Discussion</option>
                          <option value="Maintenance & Servicing">Maintenance & Servicing</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Vehicle Reg No (Optional)</label>
                        <input 
                          type="text" 
                          value={formData.vehicleNo} 
                          onChange={(e) => setFormData({...formData, vehicleNo: e.target.value})}
                          placeholder="e.g. TN 38 BX 1234" 
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none"
                        />
                      </div>
                    </div>

                    <div className="flex gap-3 mt-6">
                      <button type="button" onClick={() => setStep(2)} className="w-1/3 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-semibold text-sm hover:bg-slate-700">Back</button>
                      <button type="submit" className="w-2/3 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm transition">Generate Visitor Pass</button>
                    </div>
                  </form>
                )}

                {step === 5 && registeredBadge && (
                  <div className="text-center">
                    <div className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-3 rounded-xl text-xs font-bold mb-4">
                      ✓ Visitor Pass Generated Successfully
                    </div>

                    <div className="bg-white text-slate-900 rounded-2xl p-6 shadow-2xl border border-slate-200 text-left">
                      <div className="flex justify-between items-start border-b pb-4 mb-4">
                        <div>
                          <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Campus Visitor Pass</div>
                          <div className="text-xl font-extrabold text-blue-900">{registeredBadge.id}</div>
                        </div>
                        <VistaLogo className="h-8" />
                      </div>

                      <div className="space-y-2 text-sm mb-4">
                        <div><span className="text-slate-500 text-xs uppercase block">Visitor Name</span> <span className="font-bold text-base">{registeredBadge.name}</span></div>
                        <div><span className="text-slate-500 text-xs uppercase block">Host Staff</span> <span className="font-semibold text-blue-700">{registeredBadge.host}</span> ({registeredBadge.dept})</div>
                        <div className="grid grid-cols-2 gap-2 pt-2 border-t text-xs">
                          <div><span className="text-slate-400">Entry Time:</span> <span className="font-bold text-slate-800">{registeredBadge.checkIn}</span></div>
                          <div><span className="text-slate-400">Status:</span> <span className="font-bold text-emerald-600">Active Campus Pass</span></div>
                        </div>
                      </div>

                      <div className="text-center pt-3 border-t text-xs text-slate-500">
                        Please show this digital pass to the security officer at the front gate.
                      </div>
                    </div>

                    <button 
                      onClick={() => { setStep(1); setFormData({ fullName: '', phone: '', email: '', company: '', govtIdLast4: '', hostId: 'VES-0103', purpose: 'Business Meeting', vehicleNo: '', assetDetails: '', photo: '' }); }}
                      className="mt-6 w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold text-xs"
                    >
                      Register Another Visitor
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* 2. STAFF & SECURITY PORTAL */}
            {view === 'staff' && (
              <div className="w-full max-w-6xl">
                {!currentUser ? (
                  // Strictly locked login wall (No 1-click test buttons, no printed passwords)
                  <div className="max-w-md mx-auto glass-card rounded-2xl p-8 border border-slate-800 shadow-2xl">
                    <div className="flex justify-center mb-6">
                      <VistaLogo className="h-16" />
                    </div>
                    <div className="text-center mb-6">
                      <h2 className="text-xl font-bold text-white">Security & Staff Portal</h2>
                      <p className="text-xs text-slate-400 mt-1">VISTA Engg Solutions Private Limited</p>
                    </div>

                    {loginError && (
                      <div className="bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3 rounded-xl text-xs font-semibold mb-4 text-center">
                        {loginError}
                      </div>
                    )}

                    <form onSubmit={handleLogin} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Username / User ID</label>
                        <input 
                          type="text" required
                          value={loginId} 
                          onChange={(e) => setLoginId(e.target.value)}
                          placeholder="Enter authorized user ID" 
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-cyan-500 focus:outline-none"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                        <input 
                          type="password" required
                          value={loginPass} 
                          onChange={(e) => setLoginPass(e.target.value)}
                          placeholder="Enter password" 
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-cyan-500 focus:outline-none"
                        />
                      </div>

                      <button 
                        type="submit" 
                        className="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm transition shadow-lg mt-2"
                      >
                        Authenticate & Access Dashboard
                      </button>
                    </form>
                  </div>
                ) : (
                  // Authorized Dashboard Interface
                  <div className="glass-card rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
                    <div className="bg-slate-900 px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white">
                          {currentUser.name[0]}
                        </div>
                        <div>
                          <div className="text-sm font-bold text-white">{currentUser.name}</div>
                          <div className="text-xs text-cyan-400 font-semibold">{currentUser.role}</div>
                        </div>
                      </div>

                      <div className="flex items-center gap-3">
                        <button 
                          onClick={() => setActiveTab('dashboard')} 
                          className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'dashboard' ? 'bg-cyan-500 text-white' : 'text-slate-400 hover:text-white'}`}
                        >
                          Dashboard
                        </button>
                        <button 
                          onClick={() => setActiveTab('employees')} 
                          className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${activeTab === 'employees' ? 'bg-cyan-500 text-white' : 'text-slate-400 hover:text-white'}`}
                        >
                          Host Personnel Master (7)
                        </button>
                        <button 
                          onClick={() => { setCurrentUser(null); setLoginId(''); setLoginPass(''); }}
                          className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-600/20 text-rose-400 border border-rose-600/30 hover:bg-rose-600/30 transition"
                        >
                          Sign Out
                        </button>
                      </div>
                    </div>

                    <div className="p-6">
                      {activeTab === 'dashboard' && (
                        <div>
                          <h3 className="text-lg font-bold text-white mb-4">Active Campus Visitors</h3>
                          <div className="overflow-x-auto rounded-xl border border-slate-800">
                            <table className="w-full text-left text-xs">
                              <thead className="bg-slate-900/80 text-slate-400 uppercase border-b border-slate-800 font-semibold">
                                <tr>
                                  <th className="p-3">Badge ID</th>
                                  <th className="p-3">Visitor Name</th>
                                  <th className="p-3">Host Staff</th>
                                  <th className="p-3">Department</th>
                                  <th className="p-3">Check-In</th>
                                  <th className="p-3">Status</th>
                                  <th className="p-3">Actions</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-800">
                                {visitors.map(vis => (
                                  <tr key={vis.id} className="hover:bg-slate-800/40">
                                    <td className="p-3 font-mono text-cyan-400 font-bold">{vis.id}</td>
                                    <td className="p-3 font-bold text-white">{vis.name}</td>
                                    <td className="p-3 text-slate-300">{vis.host}</td>
                                    <td className="p-3 text-slate-400">{vis.dept}</td>
                                    <td className="p-3 text-slate-400">{vis.checkIn}</td>
                                    <td className="p-3">
                                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${vis.status === 'Inside' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700 text-slate-400'}`}>
                                        {vis.status}
                                      </span>
                                    </td>
                                    <td className="p-3">
                                      {vis.status === 'Inside' && (
                                        <button 
                                          onClick={() => setVisitors(visitors.map(v => v.id === vis.id ? {...v, status: 'Checked Out', checkOut: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} : v))}
                                          className="px-2.5 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg hover:bg-amber-500/30 font-semibold"
                                        >
                                          Check Out
                                        </button>
                                      )}
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}

                      {activeTab === 'employees' && (
                        <div>
                          <div className="flex justify-between items-center mb-4">
                            <div>
                              <h3 className="text-lg font-bold text-white">Host Personnel Master Directory</h3>
                              <p className="text-xs text-slate-400">Strictly filtered: Zero contact phones or emails exposed.</p>
                            </div>
                            <span className="px-3 py-1 bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded-full text-xs font-semibold">Official 7-Host Roster</span>
                          </div>

                          <div className="overflow-x-auto rounded-xl border border-slate-800">
                            <table className="w-full text-left text-xs">
                              <thead className="bg-slate-900/80 text-slate-400 uppercase border-b border-slate-800 font-semibold">
                                <tr>
                                  <th className="p-3">Employee ID</th>
                                  <th className="p-3">Full Name</th>
                                  <th className="p-3">Department / Unit</th>
                                  <th className="p-3">Designation</th>
                                  <th className="p-3">System Access Role</th>
                                  <th className="p-3">Status</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-800">
                                {OFFICIAL_EMPLOYEES.map(emp => (
                                  <tr key={emp.id} className="hover:bg-slate-800/40">
                                    <td className="p-3 font-mono text-cyan-400 font-bold">{emp.id}</td>
                                    <td className="p-3 font-bold text-white">{emp.name}</td>
                                    <td className="p-3 text-slate-300">{emp.dept}</td>
                                    <td className="p-3 text-slate-400">{emp.role}</td>
                                    <td className="p-3">
                                      <span className="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                                        {emp.access}
                                      </span>
                                    </td>
                                    <td className="p-3"><span className="text-emerald-400 font-semibold">● Active</span></td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Clean Footer with Discreet Staff Switcher for Gate Management */}
          <footer className="border-t border-slate-800/80 py-3 px-6 flex items-center justify-between text-xs text-slate-500">
            <div>© 2026 VISTA Engg Solutions Private Limited. All Rights Reserved.</div>
            <div className="flex items-center gap-2">
              <button 
                onClick={() => { setView('staff'); }} 
                title="Staff Portal Login"
                className="hover:text-slate-300 transition"
              >
                🔒 Staff Access
              </button>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
