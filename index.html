  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VISTA Visitor Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080c16; color: #f8fafc; }
    .glass-card { background: rgba(13, 20, 36, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.07); }
    .glass-sidebar { background: rgba(10, 16, 30, 0.95); border-right: 1px solid rgba(255, 255, 255, 0.08); }
    .vista-logo-frame { aspect-ratio: 16 / 10; display: inline-flex; align-items: center; justify-content: center; background: #ffffff; padding: 6px 12px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
  </style>
</head>
<body class="min-h-screen text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const VistaLogo = ({ className = "h-9" }) => (
      <div className={`vista-logo-frame ${className}`}>
        <svg viewBox="0 0 480 300" className="w-full h-full object-contain" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(15, 10)">
            <circle cx="115" cy="22" r="6" fill="#9d174d"/>
            <circle cx="95" cy="28" r="7" fill="#be185d"/>
            <circle cx="78" cy="38" r="8" fill="#db2777"/>
            <circle cx="64" cy="52" r="9" fill="#c026d3"/>
            <circle cx="53" cy="70" r="9.5" fill="#a855f7"/>
            <circle cx="46" cy="92" r="10" fill="#9333ea"/>
            <circle cx="43" cy="116" r="10.5" fill="#7e22ce"/>
            <circle cx="44" cy="142" r="10.5" fill="#6b21a8"/>
            <circle cx="51" cy="168" r="10" fill="#581c87"/>
            <circle cx="63" cy="192" r="9.5" fill="#4c1d95"/>
            <circle cx="79" cy="214" r="9" fill="#3b0764"/>
            <circle cx="140" cy="28" r="5.5" fill="#be185d"/>
            <circle cx="120" cy="36" r="6.5" fill="#db2777"/>
            <circle cx="103" cy="48" r="7.5" fill="#c026d3"/>
            <circle cx="89" cy="64" r="8.5" fill="#9333ea"/>
            <circle cx="79" cy="84" r="9" fill="#7c3aed"/>
            <circle cx="73" cy="106" r="9.5" fill="#6366f1"/>
            <circle cx="72" cy="130" r="9.5" fill="#4f46e5"/>
            <circle cx="76" cy="154" r="9.5" fill="#4338ca"/>
            <circle cx="85" cy="176" r="9" fill="#3730a3"/>
            <circle cx="99" cy="196" r="8.5" fill="#312e81"/>
            <circle cx="165" cy="40" r="5" fill="#db2777"/>
            <circle cx="145" cy="50" r="6" fill="#c026d3"/>
            <circle cx="127" cy="64" r="7" fill="#8b5cf6"/>
            <circle cx="112" cy="82" r="8" fill="#6366f1"/>
            <circle cx="102" cy="102" r="8.5" fill="#3b82f6"/>
            <circle cx="98" cy="124" r="8.5" fill="#2563eb"/>
            <circle cx="100" cy="146" r="8.5" fill="#1d4ed8"/>
            <circle cx="108" cy="166" r="8" fill="#1e40af"/>
            <circle cx="121" cy="184" r="7.5" fill="#1e3a8a"/>
            <circle cx="190" cy="60" r="4.5" fill="#a855f7"/>
            <circle cx="170" cy="72" r="5.5" fill="#818cf8"/>
            <circle cx="152" cy="88" r="6.5" fill="#38bdf8"/>
            <circle cx="137" cy="108" r="7" fill="#0ea5e9"/>
            <circle cx="128" cy="128" r="7.5" fill="#0284c7"/>
            <circle cx="126" cy="148" r="7.5" fill="#0369a1"/>
            <circle cx="132" cy="166" r="7" fill="#075985"/>
            <circle cx="215" cy="85" r="4" fill="#6366f1"/>
            <circle cx="195" cy="98" r="5" fill="#38bdf8"/>
            <circle cx="177" cy="115" r="6" fill="#06b6d4"/>
            <circle cx="162" cy="134" r="6.5" fill="#0891b2"/>
            <circle cx="154" cy="152" r="6.5" fill="#0e7490"/>
            <circle cx="238" cy="115" r="3.5" fill="#06b6d4"/>
            <circle cx="218" cy="128" r="4.5" fill="#14b8a6"/>
            <circle cx="199" cy="143" r="5.5" fill="#0d9488"/>
            <circle cx="184" cy="159" r="6" fill="#0f766e"/>
            <circle cx="258" cy="148" r="3.5" fill="#10b981"/>
            <circle cx="238" cy="160" r="4.5" fill="#059669"/>
            <circle cx="218" cy="172" r="5" fill="#047857"/>
            <circle cx="272" cy="182" r="3" fill="#10b981"/>
            <circle cx="252" cy="192" r="4" fill="#059669"/>
            <circle cx="282" cy="216" r="3" fill="#059669"/>
            <circle cx="318" cy="222" r="2.5" fill="#047857"/>
            <circle cx="352" cy="226" r="2" fill="#065f46"/>
          </g>
          <text x="150" y="152" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="900" fontSize="98" fill="#111c4e" letterSpacing="0">VISTA</text>
          <text x="408" y="92" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="800" fontSize="22" fill="#111c4e">TM</text>
          <text x="290" y="214" textAnchor="middle" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="600" fontSize="32" fill="#0f172a" letterSpacing="1.5">Innovation @ work</text>
        </svg>
      </div>
    );

    const OFFICIAL_EMPLOYEES = [
      { id: "VES-0101", name: "Magesh Kumar S", dept: "Indian Operations", role: "Head - Operations", access: "Management / Host", status: "Active" },
      { id: "VES-0102", name: "Mohan D", dept: "Operations", role: "Operations Lead", access: "Management / Host", status: "Active" },
      { id: "VES-0103", name: "Hariprasath", dept: "Frontdesk / Reception", role: "Frontdesk / Reception", access: "Frontdesk / Reception", status: "Active" },
      { id: "VES-0104", name: "Pradeepa M", dept: "HR & Talent Acquisition", role: "Recruiter", access: "Host", status: "Active" },
      { id: "VES-0105", name: "Sakthi Nathan M", dept: "HR & Talent Acquisition", role: "Recruiter", access: "Host", status: "Active" },
      { id: "VES-0106", name: "Naveen Kumar", dept: "Engineering & Projects", role: "Project Manager", access: "Host", status: "Active" },
      { id: "VES-0107", name: "Keerthivasan D", dept: "Engineering & Projects", role: "Project Manager", access: "Host", status: "Active" }
    ];

    const STORAGE_KEY = "VISTA_VMS_VISITORS_DATA";
    const SESSION_KEY = "VISTA_VMS_ACTIVE_SESSION";
    const SYNC_TOPIC = "vista/vms/global_sync_channel_v1";
    const TOTAL_QUOTA_MB = 5120; // 5 GB

    function App() {
      const queryParams = new URLSearchParams(window.location.search);
      const isVisitorParam = queryParams.get('mode') === 'visitor';
      const isStaffParam = queryParams.get('portal') === 'staff';

      // 1. PERSISTENT AUTHENTICATION STATE (Fixes refresh logout bug)
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem(SESSION_KEY);
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [view, setView] = useState(currentUser || isStaffParam ? 'staff' : 'visitor');
      const [activeTab, setActiveTab] = useState('dashboard');

      const [loginId, setLoginId] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      const [step, setStep] = useState(1);
      const [formData, setFormData] = useState({
        fullName: '', phone: '', company: '', govtIdLast4: '',
        hostId: 'VES-0103', purpose: 'Business Meeting', 
        comeByWalk: true, vehicleNo: '', assetDetails: '', photo: ''
      });
      const [cameraActive, setCameraActive] = useState(false);
      const [registeredBadge, setRegisteredBadge] = useState(null);

      // Local master visitor log
      const [visitors, setVisitors] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const mqttClientRef = useRef(null);

      // Save visitors to localStorage on update
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(visitors));
        } catch (e) {
          console.error("Storage save error", e);
        }
      }, [visitors]);

      // 2. REAL-TIME CROSS-DEVICE CLOUD SYNC (Fixes mobile scan not reflecting on desktop)
      useEffect(() => {
        if (!window.mqtt) return;

        const client = window.mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
          keepalive: 60,
          clientId: 'vista_' + Math.random().toString(16).substring(2, 10),
          clean: true,
          reconnectPeriod: 2000
        });

        mqttClientRef.current = client;

        client.on('connect', () => {
          client.subscribe(SYNC_TOPIC, (err) => {
            if (!err) console.log("Connected to Real-Time VISTA Gate Cloud Sync");
          });
        });

        client.on('message', (topic, message) => {
          if (topic === SYNC_TOPIC) {
            try {
              const payload = JSON.parse(message.toString());
              if (payload.action === 'NEW_VISITOR') {
                setVisitors(prev => {
                  if (prev.some(v => v.id === payload.data.id)) return prev;
                  return [payload.data, ...prev];
                });
              } else if (payload.action === 'CHECKOUT') {
                setVisitors(prev => prev.map(v => v.id === payload.id ? { ...v, status: 'Checked Out', checkOut: payload.time } : v));
              }
            } catch (err) {
              console.error("Sync parse error", err);
            }
          }
        });

        return () => {
          if (client) client.end();
        };
      }, []);

      // Storage quota monitoring
      const [simulatedUsageMB, setSimulatedUsageMB] = useState(0);
      const rawStorageMB = Number(((JSON.stringify(visitors).length * 2) / (1024 * 1024)).toFixed(2));
      const effectiveStorageMB = simulatedUsageMB > 0 ? simulatedUsageMB : Number((rawStorageMB + 2.5).toFixed(2));
      const storagePct = Math.min(100, Math.round((effectiveStorageMB / TOTAL_QUOTA_MB) * 100));

      const [scannerActive, setScannerActive] = useState(false);
      const [scannerMessage, setScannerMessage] = useState('');

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const badgeQrRef = useRef(null);
      const standeeQrRef = useRef(null);
      const [standeeModalOpen, setStandeeModalOpen] = useState(false);

      const startCamera = async () => {
        try {
          setCameraActive(true);
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 480 } });
          if (videoRef.current) videoRef.current.srcObject = stream;
        } catch (err) {
          alert("Camera access unavailable. Registration can proceed without photo.");
          setCameraActive(false);
        }
      };

      const capturePhoto = () => {
        if (!videoRef.current || !canvasRef.current) return;
        const video = videoRef.current;
        const canvas = canvasRef.current;
        canvas.width = 300;
        canvas.height = 300;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, 300, 300);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
        setFormData({ ...formData, photo: dataUrl });

        if (video.srcObject) {
          video.srcObject.getTracks().forEach(t => t.stop());
        }
        setCameraActive(false);
      };

      // Persistent Login Action
      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const id = loginId.trim().toLowerCase();
        const pass = loginPass.trim();

        let userObj = null;
        if (id === 'superuser' && pass === 'vista@super') {
          userObj = { name: "Super User", role: "Super User / Executive Access", level: "super" };
        } else if (id === 'admin' && pass === 'vista@admin') {
          userObj = { name: "System Admin", role: "System Administrator", level: "admin" };
        } else if (id === 'frontdesk' && pass === 'vista@gate') {
          userObj = { name: "Front Desk Officer", role: "Front Desk & Security Operations", level: "frontdesk" };
        }

        if (userObj) {
          setCurrentUser(userObj);
          localStorage.setItem(SESSION_KEY, JSON.stringify(userObj));
        } else {
          setLoginError('Invalid credentials. Access restricted to authorized personnel.');
        }
      };

      const handleSignOut = () => {
        setCurrentUser(null);
        localStorage.removeItem(SESSION_KEY);
        setLoginId('');
        setLoginPass('');
      };

      // Visitor Self-Registration submission
      const handleVisitorSubmit = (e) => {
        if (e) e.preventDefault();
        const hostObj = OFFICIAL_EMPLOYEES.find(emp => emp.id === formData.hostId) || OFFICIAL_EMPLOYEES[2];
        const newBadge = {
          id: `VIS-${Math.floor(1000 + Math.random() * 9000)}`,
          name: formData.fullName,
          phone: formData.phone,
          company: formData.company || "Independent Guest",
          host: hostObj.name,
          dept: hostObj.dept,
          purpose: formData.purpose,
          logistics: formData.comeByWalk ? "Come by Walk" : (formData.vehicleNo || "Vehicle"),
          asset: formData.assetDetails || "None",
          photo: formData.photo,
          status: "Inside",
          checkIn: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          checkOut: "-"
        };

        // Broadcast to Real-Time Cloud
        if (mqttClientRef.current && mqttClientRef.current.connected) {
          mqttClientRef.current.publish(SYNC_TOPIC, JSON.stringify({
            action: 'NEW_VISITOR',
            data: newBadge
          }));
        }

        const updated = [newBadge, ...visitors];
        setVisitors(updated);
        setRegisteredBadge(newBadge);
        setStep(5);
      };

      const handleCheckOut = (id) => {
        const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        if (mqttClientRef.current && mqttClientRef.current.connected) {
          mqttClientRef.current.publish(SYNC_TOPIC, JSON.stringify({
            action: 'CHECKOUT',
            id: id,
            time: timeNow
          }));
        }

        const updated = visitors.map(v => v.id === id ? { ...v, status: 'Checked Out', checkOut: timeNow } : v);
        setVisitors(updated);
      };

      // Camera QR Scanner
      useEffect(() => {
        let html5QrCode = null;
        if (activeTab === 'scanner' && scannerActive && window.Html5Qrcode) {
          html5QrCode = new window.Html5Qrcode("qr-reader");
          html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
              const match = decodedText.match(/VIS-\d{4}/);
              if (match) {
                const badgeId = match[0];
                const found = visitors.find(v => v.id === badgeId);
                if (found) {
                  if (found.status === 'Inside') {
                    handleCheckOut(badgeId);
                    setScannerMessage(`Checked OUT: ${found.name} (${badgeId}) successfully.`);
                  } else {
                    setScannerMessage(`${found.name} (${badgeId}) is already Checked Out.`);
                  }
                } else {
                  setScannerMessage(`Badge ${badgeId} not found.`);
                }
              } else {
                setScannerMessage("Invalid VISTA QR format.");
              }
            },
            () => {}
          ).catch(err => {
            console.error(err);
            setScannerActive(false);
          });
        }
        return () => {
          if (html5QrCode) html5QrCode.stop().catch(() => {});
        };
      }, [activeTab, scannerActive, visitors]);

      useEffect(() => {
        if (step === 5 && registeredBadge && badgeQrRef.current && window.QRCode) {
          window.QRCode.toCanvas(badgeQrRef.current, `VISTA-PASS:${registeredBadge.id}:${registeredBadge.name}`, { width: 140, margin: 1 });
        }
      }, [step, registeredBadge]);

      useEffect(() => {
        if (standeeModalOpen && standeeQrRef.current && window.QRCode) {
          window.QRCode.toCanvas(standeeQrRef.current, "https://vistaesglobal-crypto.github.io/vista-VMS/?mode=visitor", { width: 240, margin: 1 });
        }
      }, [standeeModalOpen]);

      // Excel Export WITH EMBEDDED IMAGES (ExcelJS Engine)
      const exportToExcelWithImages = async () => {
        if (!window.ExcelJS) {
          alert("Excel engine initializing. Please try in a moment.");
          return;
        }

        const workbook = new window.ExcelJS.Workbook();
        workbook.creator = "VISTA Visitor Management System";
        workbook.created = new Date();

        const worksheet = workbook.addWorksheet("Visitor Register");

        worksheet.columns = [
          { header: "Photo", key: "photo", width: 15 },
          { header: "Badge ID", key: "id", width: 14 },
          { header: "Visitor Name", key: "name", width: 24 },
          { header: "Phone", key: "phone", width: 16 },
          { header: "Company", key: "company", width: 22 },
          { header: "Host Personnel", key: "host", width: 22 },
          { header: "Department", key: "dept", width: 24 },
          { header: "Visit Purpose", key: "purpose", width: 24 },
          { header: "Logistics", key: "logistics", width: 18 },
          { header: "Check-In", key: "checkIn", width: 14 },
          { header: "Check-Out", key: "checkOut", width: 14 },
          { header: "Status", key: "status", width: 14 }
        ];

        const headerRow = worksheet.getRow(1);
        headerRow.font = { bold: true, color: { argb: "FFFFFFFF" } };
        headerRow.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF111C4E" } };
        headerRow.height = 25;
        headerRow.alignment = { vertical: "middle", horizontal: "center" };

        visitors.forEach((v, index) => {
          const rowNumber = index + 2;
          const row = worksheet.addRow({
            photo: "",
            id: v.id,
            name: v.name,
            phone: v.phone,
            company: v.company,
            host: v.host,
            dept: v.dept,
            purpose: v.purpose,
            logistics: v.logistics,
            checkIn: v.checkIn,
            checkOut: v.checkOut,
            status: v.status
          });

          row.height = 55;
          row.alignment = { vertical: "middle" };

          if (v.photo && v.photo.startsWith("data:image")) {
            try {
              const imageId = workbook.addImage({
                base64: v.photo,
                extension: "jpeg"
              });

              worksheet.addImage(imageId, {
                tl: { col: 0.1, row: rowNumber - 1 + 0.1 },
                ext: { width: 60, height: 60 },
                editAs: "oneCell"
              });
            } catch (err) {
              console.error("Image embed error", err);
            }
          }
        });

        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `VISTA_Visitor_Register_${new Date().toISOString().slice(0, 10)}.xlsx`;
        link.click();
      };

      // PDF Export WITH EMBEDDED IMAGES
      const exportToPDFWithImages = () => {
        if (!window.jspdf) return;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF("l", "mm", "a4");

        doc.setFontSize(15);
        doc.setTextColor(17, 28, 78);
        doc.text("VISTA Engg Solutions Private Limited", 14, 14);
        doc.setFontSize(10);
        doc.setTextColor(100);
        doc.text(`Official Visitor Log • Generated: ${new Date().toLocaleString()}`, 14, 20);

        const tableBody = visitors.map(v => [
          "",
          v.id,
          v.name,
          v.company,
          v.host,
          v.dept,
          v.purpose,
          v.logistics,
          v.checkIn,
          v.checkOut,
          v.status
        ]);

        doc.autoTable({
          head: [["Photo", "Badge ID", "Visitor Name", "Company", "Host", "Dept", "Purpose", "Logistics", "In", "Out", "Status"]],
          body: tableBody,
          startY: 24,
          theme: "grid",
          headStyles: { fillColor: [17, 28, 78], textColor: [255, 255, 255], fontStyle: "bold" },
          styles: { fontSize: 8, minCellHeight: 16, verticalAlign: "middle" },
          columnStyles: {
            0: { cellWidth: 18, halign: "center" }
          },
          didDrawCell: (data) => {
            if (data.section === "body" && data.column.index === 0) {
              const rowIndex = data.row.index;
              const visitorItem = visitors[rowIndex];
              if (visitorItem && visitorItem.photo && visitorItem.photo.startsWith("data:image")) {
                try {
                  doc.addImage(
                    visitorItem.photo,
                    "JPEG",
                    data.cell.x + 2,
                    data.cell.y + 1,
                    14,
                    14
                  );
                } catch (e) {
                  console.error("PDF image draw error", e);
                }
              }
            }
          }
        });

        doc.save(`VISTA_Visitor_Register_${new Date().toISOString().slice(0, 10)}.pdf`);
      };

      const handleStoragePurge = async () => {
        await exportToExcelWithImages();
        const purged = visitors.map(v => ({ ...v, photo: "" }));
        setVisitors(purged);
        setSimulatedUsageMB(0);
        alert("Zero-Loss Archival complete! Excel workbook with embedded photos downloaded. Storage freed.");
      };

      const activeInsideCount = visitors.filter(v => v.status === "Inside").length;
      const todayTotalVisits = visitors.length;

      return (
        <div className="min-h-screen flex flex-col">
          
          {storagePct >= 75 && (
            <div className={`px-6 py-2 text-xs font-bold text-center flex items-center justify-center gap-2 ${storagePct >= 90 ? 'bg-rose-600 text-white' : 'bg-amber-500 text-slate-900'}`}>
              <span>⚠️ {storagePct >= 90 ? 'CRITICAL STORAGE ALERT (≥90% Quota Exceeded): Purge media or export logs immediately.' : 'STORAGE CAPACITY WARNING (≥75%): Nearing quota limit.'}</span>
              <button onClick={() => { setView('staff'); setActiveTab('storage'); }} className="underline font-black uppercase text-[11px] ml-2">Open Storage Console &rarr;</button>
            </div>
          )}

          {!isVisitorParam && (
            <header className="border-b border-slate-800 bg-slate-950/90 px-6 py-3 flex items-center justify-between sticky top-0 z-30">
              <div className="flex items-center gap-3">
                <VistaLogo className="h-9" />
                <div>
                  <h1 className="font-bold text-white text-base leading-tight">VISTA Engg Solutions Private Limited</h1>
                  <p className="text-xs text-cyan-400 font-medium">Visitor Management System</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
