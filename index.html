  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FREE_STORAGE_LIMIT_MB = 1024; // 1 GB bucket quota
    const GITHUB_LIVE_BASE_URL = "https://vistaesglobal-crypto.github.io/vista-VMS/";
    const VISITOR_DEDICATED_URL = "https://vistaesglobal-crypto.github.io/vista-VMS/?mode=visitor";

    function VistaLogo({ className = "h-9", containerClass = "" }) {
<!-- ... existing code ... -->
    function App() {
      // 1. STRICT ROUTING & VISITOR DECOUPLING:
      // Checks query parameter '?mode=visitor' or hash
      const [viewMode, setViewMode] = useState(() => {
        const search = window.location.search.toLowerCase();
        const hash = window.location.hash.toLowerCase();
        if (search.includes('portal') || hash.includes('portal') || hash.includes('login') || hash.includes('admin')) {
          return 'internal';
        }
        return 'public';
      });

      // Strict Visitor Isolation mode: completely hides the staff header & navigation
      const [isVisitorIsolated, setIsVisitorIsolated] = useState(() => {
        const search = window.location.search.toLowerCase();
        const hash = window.location.hash.toLowerCase();
        return search.includes('mode=visitor') || hash.includes('visitor') || (!search.includes('portal') && !hash.includes('portal'));
      });

      // 2. HARD AUTHENTICATION WALL: Strictly null on load
      const [currentUser, setCurrentUser] = useState(null);
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [loginError, setLoginError] = useState('');
<!-- ... existing code ... -->
      // Listen to browser URL changes for robust routing
      useEffect(() => {
        const handleRouting = () => {
          const search = window.location.search.toLowerCase();
          const hash = window.location.hash.toLowerCase();
          if (search.includes('portal') || hash.includes('portal') || hash.includes('login') || hash.includes('admin')) {
            setViewMode('internal');
            setIsVisitorIsolated(false);
          } else {
            setViewMode('public');
            setIsVisitorIsolated(true);
            setRegStep(1);
          }
        };
        window.addEventListener('popstate', handleRouting);
        window.addEventListener('hashchange', handleRouting);
        return () => {
          window.removeEventListener('popstate', handleRouting);
          window.removeEventListener('hashchange', handleRouting);
        };
      }, []);
<!-- ... existing code ... -->
      // QR Code Generator for Standee (Strictly targets the dedicated Visitor URL)
      useEffect(() => {
        if (showStandeeModal) {
          const timer = setTimeout(() => {
            const container = document.getElementById('standee-qr-target');
            if (container && window.QRCode) {
              container.innerHTML = '';
              new QRCode(container, {
                text: VISITOR_DEDICATED_URL,
                width: 200,
                height: 200,
                colorDark: '#0284c7',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
              });
            }
          }, 120);
          return () => clearTimeout(timer);
        }
      }, [showStandeeModal]);
<!-- ... existing code ... -->
      // Strict Authentication Logic (Manual input only)
      const handleLogin = (e) => {
        if (e) e.preventDefault();
        setLoginError('');
        const trimmedUser = loginUsername.trim().toLowerCase();
        const account = SYSTEM_ACCOUNTS[trimmedUser];

        if (account && account.password === loginPassword) {
          setCurrentUser(account);
          setLoginUsername('');
          setLoginPassword('');
          showToast('AUTHENTICATED', `Welcome back, ${account.displayName}! Access granted as ${account.role}.`);
        } else {
          setLoginError('Invalid credentials. Check username & password and retry.');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setLoginUsername('');
        setLoginPassword('');
        setLoginError('');
        showToast('SESSION TERMINATED', 'You have been signed out. Dashboard locked.');
      };
<!-- ... existing code ... -->
      return (
        <div className="min-h-screen flex flex-col bg-slate-900 text-slate-100">
          
          {/* Notification Toast */}
          {toast && (
            <div className="fixed top-4 right-4 z-50 bg-slate-800 border-l-4 border-sky-500 text-white p-4 rounded-xl shadow-2xl max-w-sm">
              <div className="flex items-start gap-3">
                <div className="p-2 bg-sky-600 rounded-lg">
                  <i data-lucide="bell" className="w-4 h-4 text-white"></i>
                </div>
                <div className="flex-1">
                  <span className="text-[10px] font-bold text-sky-400 uppercase tracking-wider block">{toast.title}</span>
                  <p className="text-xs font-semibold text-slate-200 mt-0.5">{toast.text}</p>
                  <span className="text-[10px] text-slate-400 mt-1 block">{toast.time}</span>
                </div>
              </div>
            </div>
          )}

          {/* Top Bar Navigation: COMPLETELY HIDDEN in Visitor Mode */}
          {!isVisitorIsolated && (
            <header className="bg-slate-950 border-b border-slate-800 px-4 py-2 flex flex-wrap items-center justify-between text-xs sticky top-0 z-40">
              <div className="flex items-center gap-3">
                <VistaLogo className="h-8" containerClass="border border-slate-700/60 shadow-sm" />
                <div className="border-l border-slate-800 pl-3">
                  <span className="font-bold text-white text-sm tracking-tight block">VISTA Engg Solutions Private Limited</span>
                  <span className="text-[10px] text-slate-400">Visitor Management System</span>
                </div>
              </div>

              <div className="flex items-center gap-2 mt-2 sm:mt-0">
                {/* Entrance Gate Standee QR */}
                <button
                  onClick={() => setShowStandeeModal(true)}
                  className="bg-sky-700 hover:bg-sky-600 text-white px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 shadow transition text-xs"
                  title="View Entrance Gate QR Poster for Visitors"
                >
                  <i data-lucide="qr-code" className="w-3.5 h-3.5"></i>
                  <span>Entrance Standee QR</span>
                </button>

                {/* View Switcher */}
                <div className="bg-slate-900 p-0.5 rounded-lg border border-slate-800 flex items-center">
                  <button
                    onClick={() => { 
                      setIsVisitorIsolated(true);
                      setViewMode('public'); 
                      setRegStep(1); 
                    }}
                    className={`px-3 py-1 rounded-md font-medium transition flex items-center gap-1.5 ${viewMode === 'public' ? 'bg-sky-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    <i data-lucide="smartphone" className="w-3.5 h-3.5"></i>
                    <span>Visitor Registration</span>
                  </button>
                  <button
                    onClick={() => {
                      setViewMode('internal');
                    }}
                    className={`px-3 py-1 rounded-md font-medium transition flex items-center gap-1.5 ${viewMode === 'internal' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>
                    <span>Staff Portal</span>
                  </button>
                </div>

                {/* Authenticated User Status & Logout */}
                {viewMode === 'internal' && currentUser && (
                  <div className="flex items-center gap-2 pl-2 border-l border-slate-800">
                    <div className="flex items-center gap-1.5 bg-slate-900 py-1 px-2.5 rounded-lg border border-slate-800">
                      <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                      <span className="font-bold text-white text-[11px]">{currentUser.displayName}</span>
                    </div>
                    <button
                      onClick={handleLogout}
                      title="Sign Out of Portal"
                      className="p-1.5 bg-slate-800 hover:bg-rose-900/60 hover:text-rose-300 text-slate-300 rounded-lg border border-slate-700 transition"
                    >
                      <i data-lucide="log-out" className="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                )}
              </div>
            </header>
          )}
<!-- ... existing code ... -->
          {/* HARD LOGIN WALL: Clean manual-only login form */}
          {viewMode === 'internal' && !currentUser && (
            <div className="flex-1 flex items-center justify-center p-6 bg-gradient-to-tr from-slate-950 via-slate-900 to-slate-950">
              <div className="w-full max-w-md bg-slate-950 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
                <div className="text-center space-y-3">
                  <div className="flex justify-center">
                    <VistaLogo className="h-14" containerClass="border border-slate-200/50 shadow-xl" />
                  </div>
                  <h2 className="text-xl font-bold text-white tracking-tight">Security & Staff Portal</h2>
                  <p className="text-xs text-slate-400">Strictly Authorized Personnel Only</p>
                </div>

                {loginError && (
                  <div className="bg-rose-950/80 border border-rose-800 text-rose-300 px-4 py-2.5 rounded-xl text-xs flex items-center gap-2">
                    <i data-lucide="alert-circle" className="w-4 h-4 shrink-0"></i>
                    <span>{loginError}</span>
                  </div>
                )}

                <form onSubmit={handleLogin} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Username / User ID</label>
                    <input
                      type="text"
                      required
                      autoComplete="username"
                      placeholder="Enter authorized username"
                      value={loginUsername}
                      onChange={(e) => setLoginUsername(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-sky-500 font-mono"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Password</label>
                    <div className="relative">
                      <input
                        type={showPassword ? "text" : "password"}
                        required
                        autoComplete="current-password"
                        placeholder="••••••••••••"
                        value={loginPassword}
                        onChange={(e) => setLoginPassword(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-3.5 pr-10 py-2.5 text-white focus:outline-none focus:border-sky-500 font-mono"
                      />
                      <button
                        type="button"
                        onClick={() => setShowPassword(!showPassword)}
                        className="absolute right-3 top-3 text-slate-400 hover:text-slate-200"
                        tabIndex="-1"
                      >
                        <i data-lucide={showPassword ? "eye-off" : "eye"} className="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg shadow-sky-600/20 transition flex items-center justify-center gap-2"
                  >
                    <i data-lucide="lock" className="w-4 h-4"></i>
                    <span>Authenticate & Access Dashboard</span>
                  </button>

                  <div className="text-center pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        setIsVisitorIsolated(true);
                        setViewMode('public');
                        setRegStep(1);
                      }}
                      className="text-xs text-slate-400 hover:text-sky-400 transition"
                    >
                      ← Return to Visitor Registration
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
<!-- ... existing code ... -->
          {/* Discrete footer for staff access when in visitor isolation mode */}
          {isVisitorIsolated && (
            <footer className="py-2.5 px-4 text-center border-t border-slate-800/40 text-[10px] text-slate-500 flex justify-between items-center bg-slate-950">
              <span>© VISTA Engg Solutions Private Limited. All rights reserved.</span>
              <button
                onClick={() => {
                  setIsVisitorIsolated(false);
                  setViewMode('internal');
                }}
                title="Staff Portal Access"
                className="opacity-40 hover:opacity-100 transition p-1 hover:text-sky-400"
              >
                <i data-lucide="shield" className="w-3.5 h-3.5"></i>
              </button>
            </footer>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
