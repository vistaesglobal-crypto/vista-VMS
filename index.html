<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VISTA Visitor Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f8fafc; }
    .glass-card { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .vista-logo-frame { aspect-ratio: 16 / 10; display: inline-flex; align-items: center; justify-content: center; background: #ffffff; padding: 6px 12px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
  </style>
</head>
<body class="min-h-screen text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Official VISTA Vector Logo (Aspect-Locked, Offline Native SVG)
    const VistaLogo = ({ className = "h-9" }) => (
      <div className={`vista-logo-frame ${className}`}>
        <svg viewBox="0 0 480 300" className="w-full h-full object-contain" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(15, 10)">
            <circle cx="115" cy="22" r="6" fill="#9d174d"/>
            <circle cx="95" cy="28" r="7" fill="#be185d"/>
            <circle cx="78" cy="38" r="8" fill="#db2777"/>
            <circle cx="64" cy="52" r="9" fill="#c026d3"/>
            <circle cx="53" cy="70" r="9.5" fill="#a855f7"/>
            <circle cx="46" cy="92" r="10" fill="#9333ea"/>
            <circle cx="43" cy="116" r="10.5" fill="#7e22ce"/>
            <circle cx="44" cy="142" r="10.5" fill="#6b21a8"/>
            <circle cx="51" cy="168" r="10" fill="#581c87"/>
            <circle cx="63" cy="192" r="9.5" fill="#4c1d95"/>
            <circle cx="79" cy="214" r="9" fill="#3b0764"/>
            <circle cx="140" cy="28" r="5.5" fill="#be185d"/>
            <circle cx="120" cy="36" r="6.5" fill="#db2777"/>
            <circle cx="103" cy="48" r="7.5" fill="#c026d3"/>
            <circle cx="89" cy="64" r="8.5" fill="#9333ea"/>
            <circle cx="79" cy="84" r="9" fill="#7c3aed"/>
            <circle cx="73" cy="106" r="9.5" fill="#6366f1"/>
            <circle cx="72" cy="130" r="9.5" fill="#4f46e5"/>
            <circle cx="76" cy="154" r="9.5" fill="#4338ca"/>
            <circle cx="85" cy="176" r="9" fill="#3730a3"/>
            <circle cx="99" cy="196" r="8.5" fill="#312e81"/>
            <circle cx="165" cy="40" r="5" fill="#db2777"/>
            <circle cx="145" cy="50" r="6" fill="#c026d3"/>
            <circle cx="127" cy="64" r="7" fill="#8b5cf6"/>
            <circle cx="112" cy="82" r="8" fill="#6366f1"/>
            <circle cx="102" cy="102" r="8.5" fill="#3b82f6"/>
            <circle cx="98" cy="124" r="8.5" fill="#2563eb"/>
            <circle cx="100" cy="146" r="8.5" fill="#1d4ed8"/>
            <circle cx="108" cy="166" r="8" fill="#1e40af"/>
            <circle cx="121" cy="184" r="7.5" fill="#1e3a8a"/>
            <circle cx="190" cy="60" r="4.5" fill="#a855f7"/>
            <circle cx="170" cy="72" r="5.5" fill="#818cf8"/>
            <circle cx="152" cy="88" r="6.5" fill="#38bdf8"/>
            <circle cx="137" cy="108" r="7" fill="#0ea5e9"/>
            <circle cx="128" cy="128" r="7.5" fill="#0284c7"/>
            <circle cx="126" cy="148" r="7.5" fill="#0369a1"/>
            <circle cx="132" cy="166" r="7" fill="#075985"/>
            <circle cx="215" cy="85" r="4" fill="#6366f1"/>
            <circle cx="195" cy="98" r="5" fill="#38bdf8"/>
            <circle cx="177" cy="115" r="6" fill="#06b6d4"/>
            <circle cx="162" cy="134" r="6.5" fill="#0891b2"/>
            <circle cx="154" cy="152" r="6.5" fill="#0e7490"/>
            <circle cx="238" cy="115" r="3.5" fill="#06b6d4"/>
            <circle cx="218" cy="128" r="4.5" fill="#14b8a6"/>
            <circle cx="199" cy="143" r="5.5" fill="#0d9488"/>
            <circle cx="184" cy="159" r="6" fill="#0f766e"/>
            <circle cx="258" cy="148" r="3.5" fill="#10b981"/>
            <circle cx="238" cy="160" r="4.5" fill="#059669"/>
            <circle cx="218" cy="172" r="5" fill="#047857"/>
            <circle cx="272" cy="182" r="3" fill="#10b981"/>
            <circle cx="252" cy="192" r="4" fill="#059669"/>
            <circle cx="282" cy="216" r="3" fill="#059669"/>
            <circle cx="318" cy="222" r="2.5" fill="#047857"/>
            <circle cx="352" cy="226" r="2" fill="#065f46"/>
          </g>
          <text x="150" y="152" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="900" fontSize="98" fill="#111c4e" letterSpacing="0">VISTA</text>
          <text x="408" y="92" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="800" fontSize="22" fill="#111c4e">TM</text>
          <text x="290" y="214" textAnchor="middle" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="600" fontSize="32" fill="#0f172a" letterSpacing="1.5">Innovation @ work</text>
        </svg>
      </div>
    );

    // Official 7 Host Personnel Directory (Zero contact numbers/emails displayed)
    const OFFICIAL_EMPLOYEES = [
      { id: "VES-0101", name: "Magesh Kumar S", dept: "Indian Operations", role: "Head - Operations", access: "Management / Host", status: "Active" },
      { id: "VES-0102", name: "Mohan D", dept: "Operations", role: "Operations Lead", access: "Management / Host", status: "Active" },
      { id: "VES-0103", name: "Hariprasath", dept: "Frontdesk / Reception", role: "Frontdesk / Reception", access: "Frontdesk / Reception", status: "Active" },
      { id: "VES-0104", name: "Pradeepa M", dept: "HR & Talent Acquisition", role: "Recruiter", access: "Host", status: "Active" },
      { id: "VES-0105", name: "Sakthi Nathan M", dept: "HR & Talent Acquisition", role: "Recruiter", access: "Host", status: "Active" },
      { id: "VES-0106", name: "Naveen Kumar", dept: "Engineering & Projects", role: "Project Manager", access: "Host", status: "Active" },
      { id: "VES-0107", name: "Keerthivasan D", dept: "Engineering & Projects", role: "Project Manager", access: "Host", status: "Active" }
    ];

    function App() {
      const queryParams = new URLSearchParams(window.location.search);
      const isVisitorParam = queryParams.get('mode') === 'visitor';
      const isStaffParam = queryParams.get('portal') === 'staff';

      const [view, setView] = useState(isStaffParam ? 'staff' : 'visitor');
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');

      // Login form state (zero hints, zero auto-fill)
      const [loginId, setLoginId] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      // Public visitor registration state (Full 4 steps)
      const [step, setStep] = useState(1);
      const [formData, setFormData] = useState({
        fullName: '', phone: '', company: '', govtIdLast4: '',
        hostId: 'VES-0103', purpose: 'Business Meeting', 
        comeByWalk: true, vehicleNo: '', assetDetails: '', photo: ''
      });
      const [cameraActive, setCameraActive] = useState(false);
      const [registeredBadge, setRegisteredBadge] = useState(null);

      // Cloud Storage Monitor Engine (1024 MB Quota)
      const [usedStorageMB, setUsedStorageMB] = useState(50.4);

      // QR Scanner State
      const [scannerActive, setScannerActive] = useState(false);
      const [scannerMessage, setScannerMessage] = useState('');

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const badgeQrRef = useRef(null);
      const standeeQrRef = useRef(null);
      const [standeeModalOpen, setStandeeModalOpen] = useState(false);

      // System records
      const [visitors, setVisitors] = useState([
        { id: "VIS-9401", name: "Karthikeyan R", phone: "9876543210", company: "ADE Circuits", host: "Magesh Kumar S", dept: "Indian Operations", purpose: "Vendor / Supplier Procurement", logistics: "Come by Walk", status: "Inside", checkIn: "10:15 AM", checkOut: "-" },
        { id: "VIS-9402", name: "Ananya Sharma", phone: "9845012345", company: "Client Tech Global", host: "Mohan D", dept: "Operations", purpose: "Business Meeting", logistics: "TN 38 CC 8989", status: "Inside", checkIn: "10:45 AM", checkOut: "-" },
        { id: "VIS-9403", name: "Venkatesh Rao", phone: "9731098765", company: "ISO Audit Team", host: "Hariprasath", dept: "Frontdesk / Reception", purpose: "Maintenance / IT Servicing", logistics: "Come by Walk", status: "Inside", checkIn: "11:00 AM", checkOut: "-" }
      ]);

      const storagePct = Math.round((usedStorageMB / 1024) * 100);

      // Start Camera for Photo Capture
      const startCamera = async () => {
        try {
          setCameraActive(true);
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 480 } });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
          }
        } catch (err) {
          alert("Camera access denied or unavailable. You may proceed without photo.");
          setCameraActive(false);
        }
      };

      // Capture Photo & compress client-side
      const capturePhoto = () => {
        if (!videoRef.current || !canvasRef.current) return;
        const video = videoRef.current;
        const canvas = canvasRef.current;
        canvas.width = 320;
        canvas.height = 320;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, 320, 320);
        const dataUrl = canvas.toDataURL('image/webp', 0.7);
        setFormData({ ...formData, photo: dataUrl });

        if (video.srcObject) {
          video.srcObject.getTracks().forEach(t => t.stop());
        }
        setCameraActive(false);
      };

      // Handle Authentication
      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const id = loginId.trim().toLowerCase();
        const pass = loginPass.trim();

        if (id === 'superuser' && pass === 'vista@super') {
          setCurrentUser({ name: "Super User", role: "Super User / Executive Access", level: "super" });
        } else if (id === 'admin' && pass === 'vista@admin') {
          setCurrentUser({ name: "System Admin", role: "System Administrator", level: "admin" });
        } else if (id === 'frontdesk' && pass === 'vista@gate') {
          setCurrentUser({ name: "Front Desk Officer", role: "Front Desk & Security Operations", level: "frontdesk" });
        } else {
          setLoginError('Invalid credentials. Access is strictly restricted to authorized personnel.');
        }
      };

      // Submit Visitor Registration
      const handleVisitorSubmit = (e) => {
        if (e) e.preventDefault();
        const hostObj = OFFICIAL_EMPLOYEES.find(e => e.id === formData.hostId) || OFFICIAL_EMPLOYEES[2];
        const newBadge = {
          id: `VIS-${Math.floor(1000 + Math.random() * 9000)}`,
          name: formData.fullName,
          phone: formData.phone,
          company: formData.company || "Independent Guest",
          host: hostObj.name,
          dept: hostObj.dept,
          purpose: formData.purpose,
          logistics: formData.comeByWalk ? "Come by Walk" : (formData.vehicleNo || "Vehicle"),
          asset: formData.assetDetails || "None",
          photo: formData.photo,
          status: "Inside",
          checkIn: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          checkOut: "-"
        };
        setVisitors([newBadge, ...visitors]);
        setRegisteredBadge(newBadge);
        setUsedStorageMB(prev => Number((prev + 0.14).toFixed(2)));
        setStep(5);
      };

      // Check Out Visitor
      const handleCheckOut = (id) => {
        const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        setVisitors(visitors.map(v => v.id === id ? { ...v, status: 'Checked Out', checkOut: timeNow } : v));
      };

      // Camera QR Scanner for Gate Operations
      useEffect(() => {
        let html5QrCode = null;
        if (activeTab === 'scanner' && scannerActive && window.Html5Qrcode) {
          html5QrCode = new window.Html5Qrcode("qr-reader");
          html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
              // Parse Badge ID
              const match = decodedText.match(/VIS-\d{4}/);
              if (match) {
                const badgeId = match[0];
                const found = visitors.find(v => v.id === badgeId);
                if (found) {
                  if (found.status === 'Inside') {
                    handleCheckOut(badgeId);
                    setScannerMessage(`Checked OUT: ${found.name} (${badgeId}) successfully.`);
                  } else {
                    setScannerMessage(`${found.name} (${badgeId}) is already Checked Out.`);
                  }
                } else {
                  setScannerMessage(`Badge ${badgeId} not found in active log.`);
                }
              } else {
                setScannerMessage("Unrecognized QR Code format.");
              }
            },
            (error) => { /* ignore frame scan errors */ }
          ).catch(err => {
            console.error("Scanner error", err);
            setScannerActive(false);
          });
        }
        return () => {
          if (html5QrCode) {
            html5QrCode.stop().catch(() => {});
          }
        };
      }, [activeTab, scannerActive]);

      // Generate Badge QR code
      useEffect(() => {
        if (step === 5 && registeredBadge && badgeQrRef.current && window.QRCode) {
          window.QRCode.toCanvas(badgeQrRef.current, `VISTA-PASS:${registeredBadge.id}:${registeredBadge.name}`, { width: 140, margin: 1 });
        }
      }, [step, registeredBadge]);

      // Generate Standee QR code
      useEffect(() => {
        if (standeeModalOpen && standeeQrRef.current && window.QRCode) {
          window.QRCode.toCanvas(standeeQrRef.current, "https://vistaesglobal-crypto.github.io/vista-VMS/?mode=visitor", { width: 240, margin: 1 });
        }
      }, [standeeModalOpen]);

      // Export Excel
      const exportToExcel = () => {
        if (!window.XLSX) return;
        const data = visitors.map(v => ({
          "Badge ID": v.id,
          "Visitor Name": v.name,
          "Phone": v.phone,
          "Company": v.company,
          "Host Employee": v.host,
          "Department": v.dept,
          "Visit Purpose": v.purpose,
          "Logistics / Vehicle": v.logistics,
          "Check-In Time": v.checkIn,
          "Check-Out Time": v.checkOut,
          "Status": v.status
        }));
        const ws = window.XLSX.utils.json_to_sheet(data);
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, "Visitor Log");
        window.XLSX.writeFile(wb, "VISTA_Visitor_Register_Export.xlsx");
      };

      // Export PDF Log
      const exportToPDF = () => {
        if (!window.jspdf) return;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');
        doc.setFontSize(16);
        doc.text("VISTA Engg Solutions Private Limited - Daily Visitor Log", 14, 15);
        doc.setFontSize(10);
        doc.text(`Generated on: ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}`, 14, 22);

        const tableData = visitors.map(v => [
          v.id, v.name, v.company, v.host, v.dept, v.purpose, v.logistics, v.checkIn, v.checkOut, v.status
        ]);

        doc.autoTable({
          head: [['Badge ID', 'Name', 'Company', 'Host', 'Dept', 'Purpose', 'Logistics', 'In', 'Out', 'Status']],
          body: tableData,
          startY: 26,
          theme: 'grid',
          headStyles: { fillColor: [17, 28, 78] },
          styles: { fontSize: 8 }
        });
        doc.save("VISTA_Visitor_Compliance_Log.pdf");
      };

      // Purge & Archival Media Export
      const handleStoragePurge = () => {
        exportToExcel();
        const purged = visitors.map(v => ({ ...v, photo: '' }));
        setVisitors(purged);
        setUsedStorageMB(12.2);
        alert("Zero-Loss Archival complete! Excel log downloaded and media binaries purged. Storage usage safely reduced to 12.2 MB.");
      };

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* Outage Critical Alerts */}
          {storagePct >= 75 && (
            <div className={`px-6 py-2 text-xs font-bold text-center flex items-center justify-center gap-2 ${storagePct >= 90 ? 'bg-rose-600 text-white' : 'bg-amber-500 text-slate-900'}`}>
              <span>⚠️ {storagePct >= 90 ? 'CRITICAL STORAGE ALERT (≥90% Quota Exceeded): Purge media or export logs immediately to prevent upload outages.' : 'STORAGE CAPACITY WARNING (≥75%): Usage nearing free cloud limit.'}</span>
              <button onClick={() => { setView('staff'); setActiveTab('storage'); }} className="underline font-black uppercase text-[11px] ml-2">Open Storage Console &rarr;</button>
            </div>
          )}

          {/* Top Header: Strictly hidden in QR-scanned visitor mode */}
          {!isVisitorParam && (
            <header className="border-b border-slate-800 bg-slate-900/90 px-6 py-3 flex items-center justify-between sticky top-0 z-30">
              <div className="flex items-center gap-3">
                <VistaLogo className="h-9" />
                <div>
                  <h1 className="font-bold text-white text-base leading-tight">VISTA Engg Solutions Private Limited</h1>
                  <p className="text-xs text-cyan-400 font-medium">Visitor Management System</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="hidden md:flex items-center gap-2 px-3 py-1 bg-slate-800/80 rounded-lg text-xs border border-slate-700">
                  <span className="text-slate-400">Cloud Storage:</span>
                  <span className={`font-semibold ${storagePct >= 90 ? 'text-rose-400 font-bold' : storagePct >= 75 ? 'text-amber-400 font-bold' : 'text-emerald-400'}`}>
                    {usedStorageMB} MB ({storagePct}%)
                  </span>
                </div>

                <button 
                  onClick={() => setStandeeModalOpen(true)}
                  className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition"
                >
                  Entrance Standee QR
                </button>
                <button 
                  onClick={() => setView('visitor')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${view === 'visitor' ? 'bg-cyan-500 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                >
                  Visitor Registration
                </button>
                <button 
                  onClick={() => setView('staff')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${view === 'staff' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                >
                  Staff Portal
                </button>
              </div>
            </header>
          )}

          {/* MAIN WORKSPACE */}
          <main className="flex-1 flex flex-col justify-center items-center p-4">
            
            {/* 1. VISITOR SELF-REGISTRATION KIOSK (FULL 4 STEPS) */}
            {view === 'visitor' && (
              <div className="w-full max-w-lg glass-card rounded-2xl p-6 sm:p-8 shadow-2xl border border-slate-800 my-4">
                <div className="flex justify-center mb-6">
                  <VistaLogo className="h-14" />
                </div>

                {/* Step 0: Welcome Screen with Footfall stats */}
                {step === 1 && (
                  <div className="text-center">
                    <h2 className="text-2xl font-bold text-white mb-2">Welcome to VISTA Campus</h2>
                    <p className="text-sm text-slate-400 mb-6">Please complete touchless self-registration to receive your campus pass.</p>
                    
                    <div className="grid grid-cols-2 gap-4 mb-6">
                      <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
                        <div className="text-xs text-slate-400 uppercase font-semibold">Total Campus Footfall</div>
                        <div className="text-2xl font-bold text-white mt-1">12,845</div>
                      </div>
                      <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
                        <div className="text-xs text-slate-400 uppercase font-semibold">Today's Sequence #</div>
                        <div className="text-2xl font-bold text-cyan-400 mt-1">#28</div>
                      </div>
                    </div>

                    <button 
                      onClick={() => setStep(2)}
                      className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold rounded-xl shadow-lg transition"
                    >
                      Register for Visit &rarr;
                    </button>
                  </div>
                )}

                {/* Step 1: Personal & ID Details */}
                {step === 2 && (
                  <form onSubmit={(e) => { e.preventDefault(); setStep(3); }}>
                    <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                      <h3 className="text-base font-bold text-white">Step 1 of 4: Contact & Identity</h3>
                      <span className="text-xs text-cyan-400 font-bold">25%</span>
                    </div>

                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Full Name *</label>
                        <input 
                          type="text" required
                          value={formData.fullName} 
                          onChange={(e) => setFormData({...formData, fullName: e.target.value})}
                          placeholder="e.g. Anand Kumar" 
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Mobile Number *</label>
                        <input 
                          type="tel" required
                          value={formData.phone} 
                          onChange={(e) => setFormData({...formData, phone: e.target.value})}
                          placeholder="10-digit mobile number" 
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Representing Company / Organization</label>
                        <input 
                          type="text"
                          value={formData.company} 
                          onChange={(e) => setFormData({...formData, company: e.target.value})}
                          placeholder="e.g. ADE Circuits / Vendor" 
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none"
                        />
                      </div>
                      <div>

                                    <td className="p-3 text-slate-300">{vis.host}</td>
                                    <td className="p-3 text-slate-400">{vis.logistics}</td>
                                    <td className="p-3 text-slate-400">{vis.checkIn}</td>
                                    <td className="p-3">
                                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${vis.status === 'Inside' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700 text-slate-400'}`}>
                                        {vis.status}
                                      </span>
                                    </td>
                                    <td className="p-3">
                                      {vis.status === 'Inside' && (
                                        <button 
                                          onClick={() => handleCheckOut(vis.id)}
                                          className="px-2.5 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg hover:bg-amber-500/30 font-semibold"
                                        >
                                          Check Out
                                        </button>
                                      )}
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}

                      {/* TAB 3: CAMERA GATE QR SCANNER */}
                      {activeTab === 'scanner' && (
                        <div className="max-w-md mx-auto text-center">
                          <h3 className="text-lg font-bold text-white mb-1">Gate Camera QR Scanner</h3>
                          <p className="text-xs text-slate-400 mb-4">Scan visitor pass QR code with webcam/phone camera to automatically check out guests.</p>

                          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 overflow-hidden mb-4">
                            <div id="qr-reader" className="w-full"></div>
                          </div>

                          {!scannerActive ? (
                            <button 
                              onClick={() => setScannerActive(true)}
                              className="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs transition"
                            >
                              Activate Scanner Camera
                            </button>
                          ) : (
                            <button 
                              onClick={() => setScannerActive(false)}
                              className="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs transition"
                            >
                              Deactivate Camera
                            </button>
                          )}

                          {scannerMessage && (
                            <div className="mt-4 p-3 bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 rounded-xl text-xs font-bold">
                              {scannerMessage}
                            </div>
                          )}
                        </div>
                      )}

                      {/* TAB 4: HOST MASTER (7) */}
                      {activeTab === 'employees' && (
                        <div>
                          <div className="flex justify-between items-center mb-4">
                            <div>
                              <h3 className="text-lg font-bold text-white">Host Personnel Master Directory</h3>
                              <p className="text-xs text-slate-400">Strictly filtered: Zero contact phones or emails exposed.</p>
                            </div>
                            <span className="px-3 py-1 bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded-full text-xs font-semibold">Official 7-Host Roster</span>
                          </div>

                          <div className="overflow-x-auto rounded-xl border border-slate-800">
                            <table className="w-full text-left text-xs">
                              <thead className="bg-slate-900/80 text-slate-400 uppercase border-b border-slate-800 font-semibold">
                                <tr>
                                  <th className="p-3">Employee ID</th>
                                  <th className="p-3">Full Name</th>
                                  <th className="p-3">Department / Unit</th>
                                  <th className="p-3">Designation</th>
                                  <th className="p-3">System Access Role</th>
                                  <th className="p-3">Status</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-800">
                                {OFFICIAL_EMPLOYEES.map(emp => (
                                  <tr key={emp.id} className="hover:bg-slate-800/40">
                                    <td className="p-3 font-mono text-cyan-400 font-bold">{emp.id}</td>
                                    <td className="p-3 font-bold text-white">{emp.name}</td>
                                    <td className="p-3 text-slate-300">{emp.dept}</td>
                                    <td className="p-3 text-slate-400">{emp.role}</td>
                                    <td className="p-3">
                                      <span className="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                                        {emp.access}
                                      </span>
                                    </td>
                                    <td className="p-3"><span className="text-emerald-400 font-semibold">● Active</span></td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}

                      {/* TAB 5: STORAGE & OUTAGES */}
                      {activeTab === 'storage' && (
                        <div className="space-y-6">
                          <div>
                            <h3 className="text-lg font-bold text-white">Free Cloud Storage Management</h3>
                            <p className="text-xs text-slate-400">Monitor usage against the 1,024 MB tier and prevent upload rejection outages.</p>
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-slate-900/60 p-5 rounded-xl border border-slate-800">
                              <div className="text-xs text-slate-400 uppercase font-semibold">Database JSON Footprint</div>
                              <div className="text-xl font-bold text-white mt-1">2.4 MB</div>
                              <p className="text-[10px] text-slate-500 mt-1">Text-based visitor logs & host tables</p>
                            </div>
                            <div className="bg-slate-900/60 p-5 rounded-xl border border-slate-800">
                              <div className="text-xs text-slate-400 uppercase font-semibold">Compressed Photos (WebP)</div>
                              <div className="text-xl font-bold text-cyan-400 mt-1">{(usedStorageMB - 2.4).toFixed(1)} MB</div>
                              <p className="text-[10px] text-slate-500 mt-1">Auto-optimized client-side badges</p>
                            </div>
                            <div className="bg-slate-900/60 p-5 rounded-xl border border-slate-800">
                              <div className="text-xs text-slate-400 uppercase font-semibold">Current Usage Quota</div>
                              <div className={`text-xl font-bold mt-1 ${storagePct >= 90 ? 'text-rose-400' : storagePct >= 75 ? 'text-amber-400' : 'text-emerald-400'}`}>
                                {storagePct}% ({usedStorageMB} / 1024 MB)
                              </div>
                              <p className="text-[10px] text-slate-500 mt-1">Amber alert at 75%, Outage at 90%</p>
                            </div>
                          </div>

                          {/* Simulation & Outage Testing */}
                          <div className="bg-slate-900/80 p-5 rounded-xl border border-slate-800">
                            <h4 className="text-sm font-bold text-white mb-2">Interactive Outage & Alert Simulator</h4>
                            <p className="text-xs text-slate-400 mb-4">Simulate quota conditions to verify security banners and preventative actions.</p>
                            <div className="flex gap-3 flex-wrap">
                              <button 
                                onClick={() => setUsedStorageMB(50.4)}
                                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold"
                              >
                                Reset Normal (50.4 MB / 5%)
                              </button>
                              <button 
                                onClick={() => setUsedStorageMB(785.0)}
                                className="px-3 py-2 bg-amber-500/20 text-amber-400 border border-amber-500/30 hover:bg-amber-500/30 rounded-lg text-xs font-semibold"
                              >
                                Trigger Warning State (785 MB / 77%)
                              </button>
                              <button 
                                onClick={() => setUsedStorageMB(945.0)}
                                className="px-3 py-2 bg-rose-500/20 text-rose-400 border border-rose-500/30 hover:bg-rose-500/30 rounded-lg text-xs font-semibold"
                              >
                                Trigger Critical Outage State (945 MB / 92%)
                              </button>
                            </div>
                          </div>

                          {/* Purge Engine */}
                          <div className="bg-slate-900/80 p-5 rounded-xl border border-slate-800 flex justify-between items-center flex-wrap gap-4">
                            <div>
                              <h4 className="text-sm font-bold text-white">Zero-Loss Archival & Purge Engine</h4>
                              <p className="text-xs text-slate-400">Downloads a complete Excel backup log and frees storage by removing expired media binaries.</p>
                            </div>
                            <button 
                              onClick={handleStoragePurge}
                              className="px-4 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-xs transition shadow-lg"
                            >
                              Export Backup & Purge Media
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Entrance Standee QR Modal */}
          {standeeModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl relative">
                <button 
                  onClick={() => setStandeeModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg font-bold"
                >
                  ✕
                </button>
                <div className="flex justify-center mb-4">
                  <VistaLogo className="h-10" />
                </div>
                <h3 className="text-base font-bold text-white">VISTA Engg Solutions Pvt Ltd</h3>
                <p className="text-xs text-cyan-400 mb-4">Security Gate Registration Standee</p>
                
                <div className="bg-white p-3 rounded-xl inline-block shadow-inner mb-4">
                  <canvas ref={standeeQrRef}></canvas>
                </div>

                <p className="text-xs text-slate-400 mb-4">Scan using phone camera at reception or gate to self-register.</p>
                <button 
                  onClick={() => window.print()}
                  className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl text-xs border border-slate-700"
                >
                  Print Standee
                </button>
              </div>
            </div>
          )}

          {/* Clean Footer with Discreet Staff Access Link */}
          <footer className="border-t border-slate-800/80 py-3 px-6 flex items-center justify-between text-xs text-slate-500">
            <div>© 2026 VISTA Engg Solutions Private Limited. All Rights Reserved.</div>
            <div>
              <button 
                onClick={() => setView('staff')} 
                title="Staff Portal Login"
                className="hover:text-slate-300 transition"
              >
                🔒 Staff Access
              </button>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
