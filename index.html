    // Strict IST Timezone Formatter Utility (UTC+05:30)
    const formatToIST = (dateInput, includeTime = true) => {
      if (!dateInput) return 'N/A';
      const date = typeof dateInput === 'string' || typeof dateInput === 'number' ? new Date(dateInput) : dateInput;
      if (isNaN(date.getTime())) return 'Invalid Date';

      return new Intl.DateTimeFormat('en-IN', {
        timeZone: 'Asia/Kolkata',
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: includeTime ? '2-digit' : undefined,
        minute: includeTime ? '2-digit' : undefined,
        second: includeTime ? '2-digit' : undefined,
        hour12: true
      }).format(date);
    };

    // Dynamic IST Greeting Engine
    const getISTGreeting = () => {
      const now = new Date();
      const istHour = parseInt(
        new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', hourCycle: 'h23' }).format(now),
        10
      );
      if (istHour >= 4 && istHour < 12) return { text: "Good Morning", icon: "🌅" };
      if (istHour >= 12 && istHour < 17) return { text: "Good Afternoon", icon: "☀️" };
      return { text: "Good Evening", icon: "🌙" };
    };

    // Interactive 3D WebGL Fluid Water Ripple Background
    const ThreeFluidBackground = () => {
      useEffect(() => {
        if (!window.THREE) return;
        const container = document.getElementById('bg-canvas-container');
        if (!container) return;
        container.innerHTML = '';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 30);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        // Fluid Mesh Simulation Plane
        const planeGeo = new THREE.PlaneGeometry(65, 45, 48, 48);
        const planeMat = new THREE.MeshStandardMaterial({
          color: 0x07152f,
          emissive: 0x030a17,
          roughness: 0.15,
          metalness: 0.85,
          wireframe: true,
          transparent: true,
          opacity: 0.4
        });
        const mesh = new THREE.Mesh(planeGeo, planeMat);
        scene.add(mesh);

        // Floating geometric particles
        const particleGeo = new THREE.BufferGeometry();
        const pCount = 200;
        const pCoords = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount * 3; i += 3) {
          pCoords[i] = (Math.random() - 0.5) * 60;
          pCoords[i + 1] = (Math.random() - 0.5) * 40;
          pCoords[i + 2] = (Math.random() - 0.5) * 20;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(pCoords, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.25, transparent: true, opacity: 0.7 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // Dynamic Lighting Rig
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const cyanSpot = new THREE.PointLight(0x06b6d4, 2, 80);
        cyanSpot.position.set(15, 15, 15);
        scene.add(cyanSpot);

        const violetSpot = new THREE.PointLight(0xa855f7, 2, 80);
        violetSpot.position.set(-15, -15, 15);
        scene.add(violetSpot);

        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
        const onPointerMove = (e) => {
          const x = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
          const y = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
          targetX = (x / window.innerWidth - 0.5) * 2;
          targetY = -(y / window.innerHeight - 0.5) * 2;
        };

        window.addEventListener('mousemove', onPointerMove, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });

        const onResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', onResize);

        let clock = new THREE.Clock();
        let animId;
        const animate = () => {
          animId = requestAnimationFrame(animate);
          const time = clock.getElapsedTime();

          mouseX += (targetX - mouseX) * 0.05;
          mouseY += (targetY - mouseY) * 0.05;

          // Water ripple vertex displacement
          const pos = planeGeo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const u = pos.getX(i);
            const v = pos.getY(i);
            const dist = Math.sqrt((u - mouseX * 20) ** 2 + (v - mouseY * 20) ** 2);
            const z = Math.sin(dist * 0.8 - time * 3) * 0.7 * Math.exp(-dist * 0.08);
            pos.setZ(i, z);
          }
          pos.needsUpdate = true;

          mesh.rotation.z = Math.sin(time * 0.1) * 0.05;
          particles.rotation.y = time * 0.03;
          cyanSpot.position.x = Math.sin(time * 0.8) * 20;
          violetSpot.position.y = Math.cos(time * 0.8) * 15;

          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('mousemove', onPointerMove);
          window.removeEventListener('touchmove', onPointerMove);
          window.removeEventListener('resize', onResize);
          if (container) container.innerHTML = '';
        };
      }, []);

      return null;
    };

    const INITIAL_EMPLOYEES = [
      { id: "VES-0101", name: "Magesh Kumar S", dept: "Indian Operations", role: "Head - Operations", access: "Management / Host", status: "Active" },
      { id: "VES-0102", name: "Mohan D", dept: "Operations", role: "Operations Lead", access: "Management / Host", status: "Active" },
      { id: "VES-0103", name: "Hariprasath", dept: "Frontdesk / Reception", role: "Frontdesk / Reception", access: "Frontdesk / Reception", status: "Active" },
      { id: "VES-0104", name: "Pradeepa M", dept: "HR & Talent Acquisition", role: "Recruiter", access: "Host", status: "Active" },
      { id: "VES-0105", name: "Sakthi Nathan M", dept: "HR & Talent Acquisition", role: "Recruiter", access: "Host", status: "Active" },
      { id: "VES-0106", name: "Naveen Kumar", dept: "Engineering & Projects", role: "Project Manager", access: "Host", status: "Active" },
      { id: "VES-0107", name: "Keerthivasan D", dept: "Engineering & Projects", role: "Project Manager", access: "Host", status: "Active" }
    ];

    const STORAGE_KEY = "VISTA_VMS_DATABASE_PROD_V8";
    const SESSION_KEY = "VISTA_VMS_SESSION_PROD_V8";
    const HOSTS_KEY = "VISTA_VMS_HOSTS_PROD_V8";
    const CREDENTIALS_KEY = "VISTA_VMS_AUTH_CREDENTIALS_V8";
    const SYNC_TOPIC = "vista/vms/live_sync_stream_v8";
    const TOTAL_QUOTA_MB = 5120; // 5 GB

    function App() {
      const queryParams = new URLSearchParams(window.location.search);
      const isVisitorParam = queryParams.get('mode') === 'visitor';
      const isStaffParam = queryParams.get('portal') === 'staff';

      // Authentication State
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const s = localStorage.getItem(SESSION_KEY);
          return s ? JSON.parse(s) : null;
        } catch (e) { return null; }
      });

      // Role Credentials Store (Allows Super User Password Reset Override)
      const [credentials, setCredentials] = useState(() => {
        try {
          const c = localStorage.getItem(CREDENTIALS_KEY);
          return c ? JSON.parse(c) : {
            superuser: 'vista@super',
            admin: 'vista@admin',
            frontdesk: 'vista@gate'
          };
        } catch (e) {
          return { superuser: 'vista@super', admin: 'vista@admin', frontdesk: 'vista@gate' };
        }
      });

      useEffect(() => {
        localStorage.setItem(CREDENTIALS_KEY, JSON.stringify(credentials));
      }, [credentials]);

      const [view, setView] = useState(currentUser || isStaffParam ? 'staff' : 'visitor');
      const [activeTab, setActiveTab] = useState('dashboard');

      const [loginId, setLoginId] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      // Public visitor registration state
      const [step, setStep] = useState(1);
      const [formData, setFormData] = useState({
        fullName: '', phone: '', address: '',
        personType: 'Fresher / Job Aspirant', personTypeOther: '',
        govtIdLast4: '', hostId: 'VES-0103',
        purpose: 'Interview / Recruitment Drive', purposeOther: '',
        comeByWalk: true, vehicleNo: '', assetDetails: '', photo: ''
      });
      const [cameraActive, setCameraActive] = useState(false);
      const [photoError, setPhotoError] = useState('');
      const [registeredBadge, setRegisteredBadge] = useState(null);

      // Hosts
      const [employees, setEmployees] = useState(() => {
        try {
          const saved = localStorage.getItem(HOSTS_KEY);
          return saved ? JSON.parse(saved) : INITIAL_EMPLOYEES;
        } catch (e) { return INITIAL_EMPLOYEES; }
      });

      const [editingHostId, setEditingHostId] = useState(null);
      const [editHostForm, setEditHostForm] = useState({ dept: '', role: '', access: '' });
      const [hostDeleteConfirm, setHostDeleteConfirm] = useState(null);

      // Super User Password Reset Modal State
      const [passwordResetModal, setPasswordResetModal] = useState(false);
      const [targetResetUser, setTargetResetUser] = useState('admin');
      const [newCustomPass, setNewCustomPass] = useState('');
      const [resetSuccessMsg, setResetSuccessMsg] = useState('');

      // Visitors Database Store
      const [visitors, setVisitors] = useState(() => {
        try {
          const s = localStorage.getItem(STORAGE_KEY);
          return s ? JSON.parse(s) : [];
        } catch (e) { return []; }
      });

      // Modals
      const [selectedVisitorModal, setSelectedVisitorModal] = useState(null);
      const [previewImageModal, setPreviewImageModal] = useState(null);
      const [genericDrilldownModal, setGenericDrilldownModal] = useState(null);
      const [exportPurgeModalOpen, setExportPurgeModalOpen] = useState(false);
      const [selectedExportFormat, setSelectedExportFormat] = useState('XLSX');
      const [purgeProcessingStep, setPurgeProcessingStep] = useState('IDLE');
      const [hardDeleteConfirmOpen, setHardDeleteConfirmOpen] = useState(false);

      const [selectedCalDate, setSelectedCalDate] = useState(new Date());
      const [calFilterDate, setCalFilterDate] = useState(null);
      const [analyticsRange, setAnalyticsRange] = useState('all');
      const [cloudConnected, setCloudConnected] = useState(false);

      const mqttClientRef = useRef(null);
      const broadcastChannelRef = useRef(null);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(visitors));
      }, [visitors]);

      // Optimized Sync Protocol with Dual WebSocket Broker
      useEffect(() => {
        if ('BroadcastChannel' in window) {
          const channel = new BroadcastChannel('vista_vms_sync_v8');
          broadcastChannelRef.current = channel;
          channel.onmessage = (event) => {
            if (event.data?.action === 'NEW_VISITOR') {
              setVisitors(prev => prev.some(v => v.id === event.data.data.id) ? prev : [event.data.data, ...prev]);
            } else if (event.data?.action === 'CHECKOUT') {
              setVisitors(prev => prev.map(v => v.id === event.data.id ? { ...v, status: 'Checked Out', checkOut: event.data.time } : v));
            } else if (event.data?.action === 'MEDIA_PURGED') {
              setVisitors(prev => prev.map(v => ({ ...v, photo: '' })));
            } else if (event.data?.action === 'WIPE_ALL') {
              setVisitors([]);
            }
          };
        }

        if (window.mqtt) {
          const client = window.mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
            keepalive: 60,
            clientId: 'vista_vms_' + Math.random().toString(16).substring(2, 10),
            clean: true,
            reconnectPeriod: 2000
          });

          mqttClientRef.current = client;
          client.on('connect', () => {
            setCloudConnected(true);
            client.subscribe(SYNC_TOPIC, { qos: 1 });
          });
          client.on('close', () => setCloudConnected(false));
          client.on('error', () => setCloudConnected(false));

          client.on('message', (topic, message) => {
            if (topic === SYNC_TOPIC) {
              try {
                const payload = JSON.parse(message.toString());
                if (payload.action === 'NEW_VISITOR') {
                  setVisitors(prev => prev.some(v => v.id === payload.data.id) ? prev : [payload.data, ...prev]);
                } else if (payload.action === 'CHECKOUT') {
                  setVisitors(prev => prev.map(v => v.id === payload.id ? { ...v, status: 'Checked Out', checkOut: payload.time } : v));
                } else if (payload.action === 'MEDIA_PURGED') {
                  setVisitors(prev => prev.map(v => ({ ...v, photo: '' })));
                } else if (payload.action === 'WIPE_ALL') {
                  setVisitors([]);
                }
              } catch (err) { console.error("Sync error", err); }
            }
          });
        }

        return () => {
          if (broadcastChannelRef.current) broadcastChannelRef.current.close();
          if (mqttClientRef.current) mqttClientRef.current.end();
        };
      }, []);

      const rawStorageMB = Number(((JSON.stringify(visitors).length * 2) / (1024 * 1024)).toFixed(2));
      const storagePct = Math.min(100, Math.round((rawStorageMB / TOTAL_QUOTA_MB) * 100));

      const [scannerActive, setScannerActive] = useState(false);
      const [scannerMessage, setScannerMessage] = useState('');

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const badgeQrRef = useRef(null);
      const standeeQrRef = useRef(null);
      const [standeeModalOpen, setStandeeModalOpen] = useState(false);

      const startCamera = async () => {
        setPhotoError('');
        try {
          setCameraActive(true);
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 480 } });
          if (videoRef.current) videoRef.current.srcObject = stream;
        } catch (err) {
          alert("Camera permission is required to capture mandatory visitor photo.");
          setCameraActive(false);
        }
      };

      // Lightweight 160x160 JPEG Compression (~8KB) for Instant Multi-Device Sync
      const capturePhoto = () => {
        if (!videoRef.current || !canvasRef.current) return;
        const video = videoRef.current;
        const canvas = canvasRef.current;
        canvas.width = 160;
        canvas.height = 160;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, 160, 160);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
        setFormData({ ...formData, photo: dataUrl });
        setPhotoError('');

        if (video.srcObject) {
          video.srcObject.getTracks().forEach(t => t.stop());
        }
        setCameraActive(false);
      };

      const handlePhoneChange = (e) => {
        const val = e.target.value;
        if (/^\d{0,10}$/.test(val)) setFormData({ ...formData, phone: val });
      };

      const handleGovtIdChange = (e) => {
        const val = e.target.value;
        if (/^\d{0,4}$/.test(val)) setFormData({ ...formData, govtIdLast4: val });
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const id = loginId.trim().toLowerCase();
        const pass = loginPass.trim();

        if (id === 'superuser' && pass === credentials.superuser) {
          const u = { name: "Super User", role: "Super User / Executive Access", level: "super" };
          setCurrentUser(u);
          localStorage.setItem(SESSION_KEY, JSON.stringify(u));
        } else if (id === 'admin' && pass === credentials.admin) {
          const u = { name: "System Admin", role: "System Administrator", level: "admin" };
          setCurrentUser(u);
          localStorage.setItem(SESSION_KEY, JSON.stringify(u));
        } else if (id === 'frontdesk' && pass === credentials.frontdesk) {
          const u = { name: "Front Desk Officer", role: "Front Desk & Security Operations", level: "frontdesk" };
          setCurrentUser(u);
          localStorage.setItem(SESSION_KEY, JSON.stringify(u));
        } else {
          setLoginError('Invalid credentials. Access restricted.');
        }
      };

      const handleSignOut = () => {
        setCurrentUser(null);
        localStorage.removeItem(SESSION_KEY);
        setLoginId('');
        setLoginPass('');
      };

      // Super User Password Reset Override Execution
      const executePasswordResetOverride = (e) => {
        e.preventDefault();
        if (!newCustomPass.trim()) return;
        setCredentials(prev => ({ ...prev, [targetResetUser]: newCustomPass.trim() }));
        setResetSuccessMsg(`Password successfully updated for '${targetResetUser}'.`);
        setTimeout(() => {
          setPasswordResetModal(false);
          setResetSuccessMsg('');
          setNewCustomPass('');
        }, 2000);
      };

      const handleVisitorSubmit = (e) => {
        if (e) e.preventDefault();
        if (!formData.photo) {
          setPhotoError("Live photo is strictly mandatory for security badge clearance.");
          return;
        }

        const effectivePersonType = formData.personType === 'Other' ? (formData.personTypeOther.trim() || 'Other Guest') : formData.personType;
        const effectivePurpose = formData.purpose === 'Other' ? (formData.purposeOther.trim() || 'General Visit') : formData.purpose;

        const nextSequence = visitors.length + 1;
        const formattedId = `VIS-${String(nextSequence).padStart(4, '0')}`;
        const hostObj = employees.find(emp => emp.id === formData.hostId) || employees[2] || INITIAL_EMPLOYEES[2];
        const now = new Date();

        const newBadge = {
          id: formattedId,
          sequence: nextSequence,
          name: formData.fullName,
          phone: formData.phone,
          address: formData.address,
          personType: effectivePersonType,
          govtIdLast4: formData.govtIdLast4,
          host: hostObj.name,
          dept: hostObj.dept,
          purpose: effectivePurpose,
          logistics: formData.comeByWalk ? "Come by Walk" : (formData.vehicleNo || "Vehicle"),
          asset: formData.assetDetails || "None",
          photo: formData.photo,
          status: "Inside",
          dateString: now.toISOString().slice(0, 10),
          checkIn: formatToIST(now),
          checkOut: "-",
          checkInHour: now.getHours(),
          timestamp: now.getTime()
        };

        if (broadcastChannelRef.current) {
          broadcastChannelRef.current.postMessage({ action: 'NEW_VISITOR', data: newBadge });
        }
        if (mqttClientRef.current?.connected) {
          mqttClientRef.current.publish(SYNC_TOPIC, JSON.stringify({ action: 'NEW_VISITOR', data: newBadge }), { qos: 1 });
        }

        setVisitors([newBadge, ...visitors]);
        setRegisteredBadge(newBadge);
        setStep(5);
      };

      const handleCheckOut = (id) => {
        const timeNow = formatToIST(new Date());
        if (broadcastChannelRef.current) {
          broadcastChannelRef.current.postMessage({ action: 'CHECKOUT', id, time: timeNow });
        }
        if (mqttClientRef.current?.connected) {
          mqttClientRef.current.publish(SYNC_TOPIC, JSON.stringify({ action: 'CHECKOUT', id, time: timeNow }), { qos: 1 });
        }
        setVisitors(visitors.map(v => v.id === id ? { ...v, status: 'Checked Out', checkOut: timeNow } : v));
      };

      const executeHardDelete = () => {
        setVisitors([]);
        if (broadcastChannelRef.current) broadcastChannelRef.current.postMessage({ action: 'WIPE_ALL' });
        if (mqttClientRef.current?.connected) mqttClientRef.current.publish(SYNC_TOPIC, JSON.stringify({ action: 'WIPE_ALL' }), { qos: 1 });
        setHardDeleteConfirmOpen(false);
      };

      // Two-Phase Verified Export & Purge Media Safeguard
      const handleExecuteExportAndPurge = async () => {
        try {
          setPurgeProcessingStep('EXPORTING');
          if (selectedExportFormat === 'XLSX') {
            await exportToExcelWithImages(visitors, "VISTA_Verified_Archive_Before_Purge");
          } else {
            exportToPDFWithImages(visitors, "VISTA_Verified_Archive_Before_Purge");
          }

          // Execute purge only after file stream generation and client trigger
          setPurgeProcessingStep('PURGING');
          const purged = visitors.map(v => ({ ...v, photo: '' }));
          setVisitors(purged);

          if (broadcastChannelRef.current) broadcastChannelRef.current.postMessage({ action: 'MEDIA_PURGED' });
          if (mqttClientRef.current?.connected) mqttClientRef.current.publish(SYNC_TOPIC, JSON.stringify({ action: 'MEDIA_PURGED' }), { qos: 1 });

          setPurgeProcessingStep('COMPLETE');
          setTimeout(() => {
            setExportPurgeModalOpen(false);
            setPurgeProcessingStep('IDLE');
          }, 1800);
        } catch (err) {
          alert("Export verification failed. Purge canceled to prevent data loss.");
          setPurgeProcessingStep('IDLE');
        }
      };

      // QR Scanner Listener
      useEffect(() => {
        let html5QrCode = null;
        if (activeTab === 'scanner' && scannerActive && window.Html5Qrcode) {
          html5QrCode = new window.Html5Qrcode("qr-reader");
          html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
              const match = decodedText.match(/VIS-\d{4}/);
              if (match) {
                const badgeId = match[0];
                const found = visitors.find(v => v.id === badgeId);
                if (found) {
                  if (found.status === 'Inside') {
                    handleCheckOut(badgeId);
                    setScannerMessage(`Checked OUT: ${found.name} (${badgeId}) successfully.`);
                  } else {
                    setScannerMessage(`${found.name} (${badgeId}) is already Checked Out.`);
                  }
                } else { setScannerMessage(`Badge ${badgeId} not found.`); }
              } else { setScannerMessage("Invalid VISTA QR format."); }
            },
            () => {}
          ).catch(err => { console.error(err); setScannerActive(false); });
        }
        return () => { if (html5QrCode) html5QrCode.stop().catch(() => {}); };
      }, [activeTab, scannerActive, visitors]);

      useEffect(() => {
        if (step === 5 && registeredBadge && badgeQrRef.current && window.QRCode) {
          window.QRCode.toCanvas(badgeQrRef.current, `VISTA-PASS:${registeredBadge.id}:${registeredBadge.name}`, { width: 140, margin: 1 });
        }
      }, [step, registeredBadge]);

      useEffect(() => {
        if (standeeModalOpen && standeeQrRef.current && window.QRCode) {
          const directUrl = window.location.origin + window.location.pathname + "?mode=visitor";
          window.QRCode.toCanvas(standeeQrRef.current, directUrl, { width: 240, margin: 1 });
        }
      }, [standeeModalOpen]);

      // Excel Generator
      const exportToExcelWithImages = async (dataset = visitors, title = "VISTA_Visitor_Register") => {
        if (!window.ExcelJS) return;
        const workbook = new window.ExcelJS.Workbook();
        workbook.creator = "VISTA Visitor Management System";
        workbook.created = new Date();

        const worksheet = workbook.addWorksheet("Visitor Log");
        worksheet.columns = [
          { header: "Photo", key: "photo", width: 15 },
          { header: "Badge ID", key: "id", width: 14 },
          { header: "Visitor Name", key: "name", width: 22 },
          { header: "Phone (IST)", key: "phone", width: 16 },
          { header: "Category", key: "personType", width: 22 },
          { header: "Address", key: "address", width: 28 },
          { header: "Govt ID (Last 4)", key: "govtIdLast4", width: 16 },
          { header: "Host Personnel", key: "host", width: 22 },
          { header: "Department", key: "dept", width: 22 },
          { header: "Visit Purpose", key: "purpose", width: 24 },
          { header: "Logistics", key: "logistics", width: 18 },
          { header: "Check-In (IST)", key: "checkIn", width: 22 },
          { header: "Check-Out (IST)", key: "checkOut", width: 22 },
          { header: "Status", key: "status", width: 14 }
        ];

        worksheet.getRow(1).font = { bold: true, color: { argb: "FFFFFFFF" } };
        worksheet.getRow(1).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF0F172A" } };
        worksheet.getRow(1).height = 25;
        worksheet.getRow(1).alignment = { vertical: "middle", horizontal: "center" };

        dataset.forEach((v, index) => {
          const rowNumber = index + 2;
          worksheet.addRow({
            photo: "", id: v.id, name: v.name, phone: v.phone,
            personType: v.personType || "-", address: v.address || "-",
            govtIdLast4: v.govtIdLast4 || "-", host: v.host, dept: v.dept,
            purpose: v.purpose, logistics: v.logistics,
            checkIn: v.checkIn, checkOut: v.checkOut, status: v.status
          });

          worksheet.getRow(rowNumber).height = 55;
          worksheet.getRow(rowNumber).alignment = { vertical: "middle" };

          if (v.photo && v.photo.startsWith("data:image")) {
            try {
              const imageId = workbook.addImage({ base64: v.photo, extension: "jpeg" });
              worksheet.addImage(imageId, {
                tl: { col: 0.1, row: rowNumber - 1 + 0.1 },
                ext: { width: 55, height: 55 },
                editAs: "oneCell"
              });
            } catch (err) {}
          }
        });

        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `${title}_${Date.now()}.xlsx`;
        link.click();
      };

      // PDF Generator
      const exportToPDFWithImages = (dataset = visitors, title = "VISTA_Visitor_Register") => {
        if (!window.jspdf) return;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF("l", "mm", "a4");

        doc.setFontSize(14);
        doc.setTextColor(17, 28, 78);
        doc.text("VISTA Engg Solutions Private Limited - Security Gate Register", 14, 14);
        doc.setFontSize(9);
        doc.setTextColor(100);
        doc.text(`Official Visitor Log (Strict IST) • Generated: ${formatToIST(new Date())}`, 14, 20);

        const tableBody = dataset.map(v => [
          "", v.id, v.name, v.personType || "-", v.address || "-",
          v.host, v.purpose, v.logistics, v.checkIn, v.checkOut, v.status
        ]);

        doc.autoTable({
          head: [["Photo", "Badge ID", "Visitor Name", "Type", "Address", "Host", "Purpose", "Logistics", "Check-In (IST)", "Check-Out (IST)", "Status"]],
          body: tableBody,
          startY: 24,
          theme: "grid",
          headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontStyle: "bold" },
          styles: { fontSize: 8, minCellHeight: 16, verticalAlign: "middle" },
          columnStyles: { 0: { cellWidth: 16, halign: "center" } },
          didDrawCell: (data) => {
            if (data.section === "body" && data.column.index === 0) {
              const item = dataset[data.row.index];
              if (item?.photo?.startsWith("data:image")) {
                try {
                  doc.addImage(item.photo, "JPEG", data.cell.x + 1.5, data.cell.y + 1, 14, 14);
                } catch (e) {}
              }
            }
          }
        });

        doc.save(`${title}_${Date.now()}.pdf`);
      };

      const now = new Date();
      const todayISO = now.toISOString().slice(0, 10);
      const oneWeekAgo = now.getTime() - (7 * 24 * 60 * 60 * 1000);
      const oneMonthAgo = now.getTime() - (30 * 24 * 60 * 60 * 1000);

      const visitsToday = visitors.filter(v => v.dateString === todayISO || (v.timestamp && v.timestamp >= (now.getTime() - 86400000))).length;
      const visitsThisWeek = visitors.filter(v => v.timestamp ? v.timestamp >= oneWeekAgo : true).length;
      const visitsThisMonth = visitors.filter(v => v.timestamp ? v.timestamp >= oneMonthAgo : true).length;
      const activeInsideCount = visitors.filter(v => v.status === "Inside").length;

      const filteredList = useMemo(() => {
        if (analyticsRange === 'today') return visitors.filter(v => v.dateString === todayISO || (v.timestamp && v.timestamp >= (now.getTime() - 86400000)));
        if (analyticsRange === 'week') return visitors.filter(v => v.timestamp ? v.timestamp >= oneWeekAgo : true);
        if (analyticsRange === 'month') return visitors.filter(v => v.timestamp ? v.timestamp >= oneMonthAgo : true);
        return visitors;
      }, [visitors, analyticsRange, todayISO, oneWeekAgo, oneMonthAgo]);

      // Top Visited Personnel
      const hostTrafficMap = {};
      employees.forEach(emp => { hostTrafficMap[emp.name] = []; });
      filteredList.forEach(v => {
        if (hostTrafficMap[v.host] !== undefined) hostTrafficMap[v.host].push(v);
        else hostTrafficMap[v.host] = [v];
      });
      const topHosts = Object.entries(hostTrafficMap).sort((a, b) => b[1].length - a[1].length);

      // Hourly Distribution
      const hourlyDistribution = { 
        "Morning (8-11 AM)": filteredList.filter(v => { const h = v.checkInHour ?? 10; return h >= 8 && h < 11; }),
        "Noon (11-2 PM)": filteredList.filter(v => { const h = v.checkInHour ?? 12; return h >= 11 && h < 14; }),
        "Afternoon (2-5 PM)": filteredList.filter(v => { const h = v.checkInHour ?? 15; return h >= 14 && h < 17; }),
        "Evening (5-8 PM)": filteredList.filter(v => { const h = v.checkInHour ?? 18; return h >= 17; })
      };

      // Logistics Distribution
      const walkVisitors = filteredList.filter(v => v.logistics === 'Come by Walk');
      const vehicleVisitors = filteredList.filter(v => v.logistics !== 'Come by Walk');
      const walkCount = walkVisitors.length;
      const vehicleCount = vehicleVisitors.length;
      const walkPct = filteredList.length ? Math.round((walkCount / filteredList.length) * 100) : 0;
      const vehiclePct = filteredList.length ? (100 - walkPct) : 0;

      // Calendar Navigation Helpers
      const year = selectedCalDate.getFullYear();
      const month = selectedCalDate.getMonth();
      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

      const getVisitorsForDay = (day) => {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        return visitors.filter(v => v.dateString === dateStr);
      };

      const selectedDayVisitors = calFilterDate ? visitors.filter(v => v.dateString === calFilterDate) : [];
      const canManageHosts = currentUser && (currentUser.level === 'super' || currentUser.level === 'admin');
      const greeting = useMemo(() => getISTGreeting(), []);

      return (
        <div className="min-h-screen flex flex-col">
          <ThreeFluidBackground />

          {/* Navigation Bar */}
          {!isVisitorParam && (
            <header className="border-b border-slate-800 bg-slate-950/85 backdrop-blur-md px-6 py-3 flex items-center justify-between sticky top-0 z-30">
              <div className="flex items-center gap-3">
                <VistaLogo className="h-9" />
                <div>
                  <h1 className="font-bold text-white text-base leading-tight">VISTA Engg Solutions Private Limited</h1>
                  <div className="flex items-center gap-2">
                    <p className="text-xs text-cyan-400 font-medium">Visitor Management System</p>
                    <span className={`inline-flex items-center gap-1 text-[10px] px-2 py-0.5 rounded-full font-semibold ${cloudConnected ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${cloudConnected ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                      {cloudConnected ? 'Cloud Sync Active' : 'Connecting Broker...'}
                    </span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="hidden md:flex items-center gap-2 px-3 py-1 bg-slate-900/90 rounded-lg text-xs border border-slate-800">
                  <span className="text-slate-400">Storage Used:</span>
                  <span className="font-semibold text-emerald-400">{rawStorageMB} MB ({storagePct}%)</span>
                </div>

                <button 
                  onClick={() => setStandeeModalOpen(true)}
                  className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900/90 text-slate-300 hover:bg-slate-800 border border-slate-700 transition"
                >
                  Entrance Standee QR
                </button>
                <button 
                  onClick={() => setView('visitor')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${view === 'visitor' ? 'bg-cyan-500 text-white shadow-md shadow-cyan-500/20' : 'bg-slate-900/90 text-slate-300 hover:bg-slate-800 border border-slate-700'}`}
                >
                  Visitor Registration
                </button>
                <button 
                  onClick={() => setView('staff')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${view === 'staff' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'bg-slate-900/90 text-slate-300 hover:bg-slate-800 border border-slate-700'}`}
                >
                  Staff Portal
                </button>
              </div>
            </header>
          )}

          <main className="flex-1 flex flex-col">
            
            {/* 1. VISITOR SELF-REGISTRATION KIOSK */}
            {view === 'visitor' && (
              <div className="flex-1 flex items-center justify-center p-4">
                <div className="w-full max-w-lg glass-card rounded-2xl p-6 sm:p-8 shadow-2xl border border-slate-800 my-4">
                  <div className="flex justify-center mb-4">
                    <VistaLogo className="h-14" />
                  </div>

                  {step === 1 && (
                    <div className="text-center">
                      <RobotMascot />
                      <div className="inline-block px-3 py-1 rounded-full bg-cyan-950/60 border border-cyan-500/30 text-cyan-400 text-xs font-semibold mb-2">
                        {formatToIST(new Date(), false)} • Strict IST Timezone
                      </div>
                      <h2 className="text-2xl font-bold text-white mb-1">
                        {greeting.text} {greeting.icon}
                      </h2>
                      <p className="text-sm text-slate-400 mb-6">Welcome to VISTA Campus. Please complete self check-in registration.</p>
                      
                      <div className="grid grid-cols-2 gap-4 mb-6">
                        <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                          <div className="text-xs text-slate-400 uppercase font-semibold">Total Campus Footfall</div>
                          <div className="text-2xl font-bold text-white mt-1">{visitors.length}</div>
                        </div>
                        <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                          <div className="text-xs text-slate-400 uppercase font-semibold">Today's Sequence #</div>
                          <div className="text-2xl font-bold text-cyan-400 mt-1">#{visitors.length + 1}</div>
                        </div>
                      </div>

                      <button 
                        onClick={() => setStep(2)}
                        className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold rounded-xl shadow-lg transition"
                      >
                        Start Registration &rarr;
                      </button>
                    </div>
                  )}

                  {/* Step 1: Contact, Address, Type of Person ("Other" Option with Custom Dialog) */}
                  {step === 2 && (
                    <form onSubmit={(e) => { e.preventDefault(); setStep(3); }}>
                      <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                        <h3 className="text-base font-bold text-white">Step 1 of 4: Contact & Identity</h3>
                        <span className="text-xs text-cyan-400 font-bold">25%</span>
                      </div>

                      <div className="space-y-3.5">
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1">Full Name * (Alpha-Numeric)</label>
                          <input 
                            type="text" required
                            value={formData.fullName} 
                            onChange={(e) => setFormData({...formData, fullName: e.target.value})}
                            placeholder="e.g. Anand Kumar" 
                            className="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none"
                          />
                        </div>

                        <div>
                          <div className="flex justify-between items-center mb-1">
                            <label className="block text-xs font-semibold text-slate-300">Mobile Number *</label>
                            <span className="text-[10px] text-cyan-400 font-bold">Strictly Numeric (10 Digits)</span>
                          </div>
                          <input 
                            type="tel" required inputMode="numeric" pattern="[0-9]{10}"
                            value={formData.phone} 
                            onChange={handlePhoneChange}
                            placeholder="e.g. 9876543210" 
                            className="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono focus:border-cyan-500 focus:outline-none tracking-wider"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1">Residential / Office Address * (Alpha-Numeric)</label>
                          <textarea 
                            required rows="2"
                            value={formData.address} 
                            onChange={(e) => setFormData({...formData, address: e.target.value})}
                            placeholder="Door / Flat No, Street, City, State, PIN" 
                            className="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none resize-none"
                          ></textarea>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1">Type of Person / Visitor Category *</label>
                          <select 
                            value={formData.personType} 
                            onChange={(e) => setFormData({...formData, personType: e.target.value})}
                            className="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:border-cyan-500 focus:outline-none"
                          >
                            <option value="Fresher / Job Aspirant">Fresher / Job Aspirant</option>
                            <option value="Experienced Professional / Candidate">Experienced Professional / Candidate</option>
                            <option value="Company / Corporate Representative">Company / Corporate Representative</option>
                            <option value="Vendor / Supplier Representative">Vendor / Supplier Representative</option>
                            <option value="Contractor / Service Technician">Contractor / Service Technician</option>
                            <option value="Client / Customer Delegate">Client / Customer Delegate</option>
                            <option value="Independent / Personal Guest">Independent / Personal Guest</option>
                            <option value="Other">Other (Specify in Dialog Box)</option>
                          </select>
                        </div>

                        {formData.personType === 'Other' && (
                          <div className="bg-slate-950 p-3 rounded-xl border border-cyan-500/50 shadow-inner">
                            <label className="block text-xs font-bold text-cyan-400 mb-1">Specify Type of Person / Affiliation *</label>
                            <input 
                              type="text" required
                              value={formData.personTypeOther} 
                              onChange={(e) => setFormData({...formData, personTypeOther: e.target.value})}
                              placeholder="Type relationship or role (e.g. Auditor, Inspector)" 
                              className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none"
                            />
                          </div>
                        )}

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setPasswordResetModal(false)}
                      className="w-1/2 py-2 bg-slate-800 text-slate-400 rounded-xl font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold shadow-lg"
                    >
                      Update Password
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 7. HOST DELETE CONFIRMATION MODAL */}
          {hostDeleteConfirm && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[75] flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-rose-500/40 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
                <div className="w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto mb-3 text-2xl font-bold">
                  🗑️
                </div>
                <h3 className="text-base font-bold text-white mb-2">Delete Host Personnel?</h3>
                <p className="text-xs text-slate-300 mb-6">
                  Are you sure you want to remove <strong className="text-white">{hostDeleteConfirm.name} ({hostDeleteConfirm.id})</strong> from the authorized host directory?
                </p>
                <div className="flex gap-3">
                  <button 
                    onClick={() => setHostDeleteConfirm(null)}
                    className="w-1/2 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold"
                  >
                    No, Cancel
                  </button>
                  <button 
                    onClick={() => deleteHost(hostDeleteConfirm.id)}
                    className="w-1/2 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold transition shadow-lg"
                  >
                    Yes, Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Entrance Standee QR Modal */}
          {standeeModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl relative">
                <button 
                  onClick={() => setStandeeModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg font-bold"
                >
                  ✕
                </button>
                <div className="flex justify-center mb-4">
                  <VistaLogo className="h-10" />
                </div>
                <h3 className="text-base font-bold text-white">VISTA Engg Solutions Pvt Ltd</h3>
                <p className="text-xs text-cyan-400 mb-4">Security Gate Registration Standee</p>
                
                <div className="bg-white p-3 rounded-xl inline-block shadow-inner mb-4">
                  <canvas ref={standeeQrRef}></canvas>
                </div>

                <p className="text-xs text-slate-400 mb-4">Scan using phone camera at reception or gate to self-register.</p>
                <button 
                  onClick={() => window.print()}
                  className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl text-xs border border-slate-700"
                >
                  Print Standee
                </button>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-800/80 py-3 px-6 flex items-center justify-between text-xs text-slate-500 relative z-20">
            <div>© 2026 VISTA Engg Solutions Private Limited. All Rights Reserved.</div>
            <div>
              <button 
                onClick={() => setView('staff')} 
                title="Staff Portal Login"
                className="hover:text-slate-300 transition"
              >
                🔒 Staff Access
              </button>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
