    .glass-card { background: rgba(13, 20, 36, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.07); }
    .glass-sidebar { background: rgba(10, 16, 30, 0.95); border-right: 1px solid rgba(255, 255, 255, 0.08); }
    .vista-logo-frame { aspect-ratio: 16 / 10; display: inline-flex; align-items: center; justify-content: center; background: #ffffff; padding: 6px 12px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
    .calendar-cell { min-height: 80px; transition: all 0.2s ease; }
    .calendar-cell:hover { background: rgba(30, 41, 59, 0.7); }
  </style>
</head>
<body class="min-h-screen text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const VistaLogo = ({ className = "h-9" }) => (
      <div className={`vista-logo-frame ${className}`}>
        <svg viewBox="0 0 480 300" className="w-full h-full object-contain" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(15, 10)">
            <circle cx="115" cy="22" r="6" fill="#9d174d"/>
            <circle cx="95" cy="28" r="7" fill="#be185d"/>

            <circle cx="63" cy="192" r="9.5" fill="#4c1d95"/>

            <circle cx="165" cy="40" r="5" fill="#db2777"/>
            <circle cx="145" cy="50" r="6" fill="#c026d3"/>
            <circle cx="127" cy="64" r="7" fill="#8b5cf6"/>

            <circle cx="102" cy="102" r="8.5" fill="#3b82f6"/>

            <circle cx="128" cy="128" r="7.5" fill="#0284c7"/>
            <circle cx="126" cy="148" r="7.5" fill="#0369a1"/>
            <circle cx="132" cy="166" r="7" fill="#075985"/>
            <circle cx="215" cy="85" r="4" fill="#6366f1"/>
            <circle cx="195" cy="98" r="5" fill="#38bdf8"/>
            <circle cx="177" cy="115" r="6" fill="#06b6d4"/>
            <circle cx="162" cy="134" r="6.5" fill="#0891b2"/>
            <circle cx="154" cy="152" r="6.5" fill="#0e7490"/>
            <circle cx="238" cy="115" r="3.5" fill="#06b6d4"/>
            <circle cx="218" cy="128" r="4.5" fill="#14b8a6"/>
            <circle cx="199" cy="143" r="5.5" fill="#0d9488"/>
            <circle cx="184" cy="159" r="6" fill="#0f766e"/>
            <circle cx="258" cy="148" r="3.5" fill="#10b981"/>
            <circle cx="238" cy="160" r="4.5" fill="#059669"/>
            <circle cx="218" cy="172" r="5" fill="#047857"/>
            <circle cx="272" cy="182" r="3" fill="#10b981"/>
            <circle cx="252" cy="192" r="4" fill="#059669"/>
            <circle cx="282" cy="216" r="3" fill="#059669"/>
            <circle cx="318" cy="222" r="2.5" fill="#047857"/>
            <circle cx="352" cy="226" r="2" fill="#065f46"/>
          </g>
          <text x="150" y="152" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="900" fontSize="98" fill="#111c4e" letterSpacing="0">VISTA</text>
          <text x="408" y="92" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="800" fontSize="22" fill="#111c4e">TM</text>
          <text x="290" y="214" textAnchor="middle" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="600" fontSize="32" fill="#0f172a" letterSpacing="1.5">Innovation @ work</text>
        </svg>
      </div>
    );

    const INITIAL_EMPLOYEES = [
      { id: "VES-0101", name: "Magesh Kumar S", dept: "Indian Operations", role: "Head - Operations", access: "Management / Host", status: "Active" },
      { id: "VES-0102", name: "Mohan D", dept: "Operations", role: "Operations Lead", access: "Management / Host", status: "Active" },
      { id: "VES-0103", name: "Hariprasath", dept: "Frontdesk / Reception", role: "Frontdesk / Reception", access: "Frontdesk / Reception", status: "Active" },
      { id: "VES-0104", name: "Pradeepa M", dept: "HR & Talent Acquisition", role: "Recruiter", access: "Host", status: "Active" },
      { id: "VES-0105", name: "Sakthi Nathan M", dept: "HR & Talent Acquisition", role: "Recruiter", access: "Host", status: "Active" },
      { id: "VES-0106", name: "Naveen Kumar", dept: "Engineering & Projects", role: "Project Manager", access: "Host", status: "Active" },
      { id: "VES-0107", name: "Keerthivasan D", dept: "Engineering & Projects", role: "Project Manager", access: "Host", status: "Active" }
    ];

    const STORAGE_KEY = "VISTA_VMS_DATABASE_PROD_V3";
    const SESSION_KEY = "VISTA_VMS_SESSION_PROD_V3";
    const HOSTS_KEY = "VISTA_VMS_HOSTS_PROD_V3";
    const SYNC_TOPIC = "vista/vms/live_sync_stream_v3";
    const TOTAL_QUOTA_MB = 5120;

    function App() {
      const queryParams = new URLSearchParams(window.location.search);
      const isVisitorParam = queryParams.get('mode') === 'visitor';
      const isStaffParam = queryParams.get('portal') === 'staff';

      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem(SESSION_KEY);
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [view, setView] = useState(currentUser || isStaffParam ? 'staff' : 'visitor');
      const [activeTab, setActiveTab] = useState('dashboard');

      // Login State
      const [loginId, setLoginId] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      // Public visitor registration state
      const [step, setStep] = useState(1);
      const [formData, setFormData] = useState({
        fullName: '',
        phone: '',
        address: '',
        personType: 'Fresher / Job Aspirant',
        organizationName: '',
        govtIdLast4: '',
        hostId: 'VES-0103',
        purpose: 'Interview / Recruitment Drive',
        comeByWalk: true,
        vehicleNo: '',
        assetDetails: '',
        photo: ''
      });
      const [cameraActive, setCameraActive] = useState(false);
      const [photoError, setPhotoError] = useState('');
      const [registeredBadge, setRegisteredBadge] = useState(null);

      // Editable Host Directory
      const [employees, setEmployees] = useState(() => {
        try {
          const saved = localStorage.getItem(HOSTS_KEY);
          return saved ? JSON.parse(saved) : INITIAL_EMPLOYEES;
        } catch (e) {
          return INITIAL_EMPLOYEES;
        }
      });

      const [editingHostId, setEditingHostId] = useState(null);
      const [editHostForm, setEditHostForm] = useState({ dept: '', role: '', access: '' });
      const [hostDeleteConfirm, setHostDeleteConfirm] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem(HOSTS_KEY, JSON.stringify(employees));
        } catch (e) {
          console.error("Host storage error", e);
        }
      }, [employees]);

      // Visitor Store
      const [visitors, setVisitors] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      // Inspection Modal State for Selected Visitor
      const [selectedVisitorModal, setSelectedVisitorModal] = useState(null);

      // Calendar View State
      const [selectedCalDate, setSelectedCalDate] = useState(new Date());
      const [calFilterDate, setCalFilterDate] = useState(null);

      // Analytics Timeframe Filter
      const [analyticsRange, setAnalyticsRange] = useState('all');

      // Cloud Sync Connection State
      const [cloudConnected, setCloudConnected] = useState(false);

      const mqttClientRef = useRef(null);
      const broadcastChannelRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(visitors));
        } catch (e) {
          console.error("Storage error", e);
        }
      }, [visitors]);

      // Cross-Device WebSocket Sync Setup
      useEffect(() => {
        if ('BroadcastChannel' in window) {
          const channel = new BroadcastChannel('vista_vms_sync_v3');
          broadcastChannelRef.current = channel;
          channel.onmessage = (event) => {
            if (event.data && event.data.action === 'NEW_VISITOR') {
              setVisitors(prev => prev.some(v => v.id === event.data.data.id) ? prev : [event.data.data, ...prev]);
            } else if (event.data && event.data.action === 'CHECKOUT') {
              setVisitors(prev => prev.map(v => v.id === event.data.id ? { ...v, status: 'Checked Out', checkOut: event.data.time } : v));
            }
          };
        }

        if (window.mqtt) {
          // Connect to standard secure WSS HiveMQ public broker
          const client = window.mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
            keepalive: 60,
            clientId: 'vista_vms_' + Math.random().toString(16).substring(2, 10),
            clean: true,
            reconnectPeriod: 2500
          });

          mqttClientRef.current = client;

          client.on('connect', () => {
            setCloudConnected(true);
            client.subscribe(SYNC_TOPIC);
          });

          client.on('close', () => setCloudConnected(false));
          client.on('error', () => setCloudConnected(false));

          client.on('message', (topic, message) => {
            if (topic === SYNC_TOPIC) {
              try {
                const payload = JSON.parse(message.toString());
                if (payload.action === 'NEW_VISITOR') {
                  setVisitors(prev => prev.some(v => v.id === payload.data.id) ? prev : [payload.data, ...prev]);
                } else if (payload.action === 'CHECKOUT') {
                  setVisitors(prev => prev.map(v => v.id === payload.id ? { ...v, status: 'Checked Out', checkOut: payload.time } : v));
                }
              } catch (err) {
                console.error("Sync payload error", err);
              }
            }
          });
        }

        return () => {
          if (broadcastChannelRef.current) broadcastChannelRef.current.close();
          if (mqttClientRef.current) mqttClientRef.current.end();
        };
      }, []);

      const [simulatedUsageMB, setSimulatedUsageMB] = useState(0);
      const rawStorageMB = Number(((JSON.stringify(visitors).length * 2) / (1024 * 1024)).toFixed(2));
      const effectiveStorageMB = simulatedUsageMB > 0 ? simulatedUsageMB : rawStorageMB;
      const storagePct = Math.min(100, Math.round((effectiveStorageMB / TOTAL_QUOTA_MB) * 100));

      const [scannerActive, setScannerActive] = useState(false);
      const [scannerMessage, setScannerMessage] = useState('');

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const badgeQrRef = useRef(null);
      const standeeQrRef = useRef(null);
      const [standeeModalOpen, setStandeeModalOpen] = useState(false);

      const startCamera = async () => {
        setPhotoError('');
        try {
          setCameraActive(true);
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 480 } });
          if (videoRef.current) videoRef.current.srcObject = stream;
        } catch (err) {
          alert("Camera permission is required to capture mandatory visitor photo.");
          setCameraActive(false);
        }
      };

      const capturePhoto = () => {
        if (!videoRef.current || !canvasRef.current) return;
        const video = videoRef.current;
        const canvas = canvasRef.current;
        canvas.width = 300;
        canvas.height = 300;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, 300, 300);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
        setFormData({ ...formData, photo: dataUrl });
        setPhotoError('');

        if (video.srcObject) {
          video.srcObject.getTracks().forEach(t => t.stop());
        }
        setCameraActive(false);
      };

      // Strict Numeric Format Handlers
      const handlePhoneChange = (e) => {
        const val = e.target.value;
        if (/^\d{0,10}$/.test(val)) {
          setFormData({ ...formData, phone: val });
        }
      };

      const handleGovtIdChange = (e) => {
        const val = e.target.value;
        if (/^\d{0,4}$/.test(val)) {
          setFormData({ ...formData, govtIdLast4: val });
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const id = loginId.trim().toLowerCase();
        const pass = loginPass.trim();

        let userObj = null;
        if (id === 'superuser' && pass === 'vista@super') {
          userObj = { name: "Super User", role: "Super User / Executive Access", level: "super" };
        } else if (id === 'admin' && pass === 'vista@admin') {
          userObj = { name: "System Admin", role: "System Administrator", level: "admin" };
        } else if (id === 'frontdesk' && pass === 'vista@gate') {
          userObj = { name: "Front Desk Officer", role: "Front Desk & Security Operations", level: "frontdesk" };
        }

        if (userObj) {
          setCurrentUser(userObj);
          localStorage.setItem(SESSION_KEY, JSON.stringify(userObj));
        } else {
          setLoginError('Invalid credentials. Access is restricted.');
        }
      };

      const handleSignOut = () => {
        setCurrentUser(null);
        localStorage.removeItem(SESSION_KEY);
        setLoginId('');
        setLoginPass('');
      };

      // Handle Visitor Submission
      const handleVisitorSubmit = (e) => {
        if (e) e.preventDefault();
        
        if (!formData.photo) {
          setPhotoError("Live photo is strictly mandatory for security badge clearance.");
          return;
        }

        const nextSequence = visitors.length + 1;
        const formattedId = `VIS-${String(nextSequence).padStart(4, '0')}`;
        const hostObj = employees.find(emp => emp.id === formData.hostId) || employees[2] || INITIAL_EMPLOYEES[2];
        const now = new Date();

        const newBadge = {
          id: formattedId,
          sequence: nextSequence,
          name: formData.fullName,
          phone: formData.phone,
          address: formData.address,
          personType: formData.personType,
          organizationName: formData.organizationName || "N/A",
          company: formData.organizationName ? `${formData.personType} (${formData.organizationName})` : formData.personType,
          govtIdLast4: formData.govtIdLast4,
          host: hostObj.name,
          dept: hostObj.dept,
          purpose: formData.purpose,
          logistics: formData.comeByWalk ? "Come by Walk" : (formData.vehicleNo || "Vehicle"),
          asset: formData.assetDetails || "None",
          photo: formData.photo,
          status: "Inside",
          dateString: now.toISOString().slice(0, 10),
          checkIn: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          checkOut: "-",
          timestamp: now.getTime()
        };

        if (broadcastChannelRef.current) {
          broadcastChannelRef.current.postMessage({ action: 'NEW_VISITOR', data: newBadge });
        }

        if (mqttClientRef.current && mqttClientRef.current.connected) {
          mqttClientRef.current.publish(SYNC_TOPIC, JSON.stringify({
            action: 'NEW_VISITOR',
            data: newBadge
          }));
        }

        const updated = [newBadge, ...visitors];
        setVisitors(updated);
        setRegisteredBadge(newBadge);
        setStep(5);
      };

      const handleCheckOut = (id) => {
        const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        if (broadcastChannelRef.current) {
          broadcastChannelRef.current.postMessage({ action: 'CHECKOUT', id, time: timeNow });
        }

        if (mqttClientRef.current && mqttClientRef.current.connected) {
          mqttClientRef.current.publish(SYNC_TOPIC, JSON.stringify({ action: 'CHECKOUT', id, time: timeNow }));
        }

        const updated = visitors.map(v => v.id === id ? { ...v, status: 'Checked Out', checkOut: timeNow } : v);
        setVisitors(updated);
      };

      // In-Page Host Master Editing Handlers (Super User & Admin)
      const startEditingHost = (emp) => {
        setEditingHostId(emp.id);
        setEditHostForm({ dept: emp.dept, role: emp.role, access: emp.access });
      };

      const saveHostEdit = (id) => {
        setEmployees(employees.map(emp => emp.id === id ? { ...emp, ...editHostForm } : emp));
        setEditingHostId(null);
      };

      const deleteHost = (id) => {
        setEmployees(employees.filter(emp => emp.id !== id));
        setHostDeleteConfirm(null);
      };

      // Camera QR Scanner
      useEffect(() => {
        let html5QrCode = null;
        if (activeTab === 'scanner' && scannerActive && window.Html5Qrcode) {
          html5QrCode = new window.Html5Qrcode("qr-reader");
          html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
              const match = decodedText.match(/VIS-\d{4}/);
              if (match) {
                const badgeId = match[0];
                const found = visitors.find(v => v.id === badgeId);
                if (found) {
                  if (found.status === 'Inside') {
                    handleCheckOut(badgeId);
                    setScannerMessage(`Checked OUT: ${found.name} (${badgeId}) successfully.`);
                  } else {
                    setScannerMessage(`${found.name} (${badgeId}) is already Checked Out.`);
                  }
                } else {
                  setScannerMessage(`Badge ${badgeId} not found.`);
                }
              } else {
                setScannerMessage("Invalid VISTA QR format.");
              }
            },
            () => {}
          ).catch(err => {
            console.error(err);
            setScannerActive(false);
          });
        }
        return () => {
          if (html5QrCode) html5QrCode.stop().catch(() => {});
        };
      }, [activeTab, scannerActive, visitors]);

      useEffect(() => {
        if (step === 5 && registeredBadge && badgeQrRef.current && window.QRCode) {
          window.QRCode.toCanvas(badgeQrRef.current, `VISTA-PASS:${registeredBadge.id}:${registeredBadge.name}`, { width: 140, margin: 1 });
        }
      }, [step, registeredBadge]);

      useEffect(() => {
        if (standeeModalOpen && standeeQrRef.current && window.QRCode) {
          window.QRCode.toCanvas(standeeQrRef.current, "https://vistaesglobal-crypto.github.io/vista-VMS/?mode=visitor", { width: 240, margin: 1 });
        }
      }, [standeeModalOpen]);

      // Excel Export with Embedded Photos
      const exportToExcelWithImages = async (dataset = visitors, title = "VISTA_Visitor_Register") => {
        if (!window.ExcelJS) {
          alert("Excel engine loading, please try again in a moment.");
          return;
        }

        const workbook = new window.ExcelJS.Workbook();
        workbook.creator = "VISTA Visitor Management System";
        workbook.created = new Date();

        const worksheet = workbook.addWorksheet("Visitor Log");

        worksheet.columns = [
          { header: "Photo", key: "photo", width: 15 },
          { header: "Badge ID", key: "id", width: 14 },
          { header: "Visitor Name", key: "name", width: 22 },
          { header: "Phone", key: "phone", width: 16 },
          { header: "Type / Category", key: "personType", width: 22 },
          { header: "Organization", key: "organizationName", width: 22 },
          { header: "Address", key: "address", width: 28 },
          { header: "Govt ID (Last 4)", key: "govtIdLast4", width: 16 },
          { header: "Host Personnel", key: "host", width: 22 },
          { header: "Department", key: "dept", width: 22 },
          { header: "Visit Purpose", key: "purpose", width: 24 },
          { header: "Logistics", key: "logistics", width: 18 },
          { header: "Check-In", key: "checkIn", width: 14 },
          { header: "Check-Out", key: "checkOut", width: 14 },
          { header: "Status", key: "status", width: 14 }
        ];

        const headerRow = worksheet.getRow(1);
        headerRow.font = { bold: true, color: { argb: "FFFFFFFF" } };
        headerRow.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF111C4E" } };
        headerRow.height = 25;
        headerRow.alignment = { vertical: "middle", horizontal: "center" };

        dataset.forEach((v, index) => {
          const rowNumber = index + 2;
          worksheet.addRow({
            photo: "",
            id: v.id,
            name: v.name,
            phone: v.phone,
            personType: v.personType || "-",
            organizationName: v.organizationName || "-",
            address: v.address || "-",
            govtIdLast4: v.govtIdLast4 || "-",
            host: v.host,
            dept: v.dept,
            purpose: v.purpose,
            logistics: v.logistics,
            checkIn: v.checkIn,
            checkOut: v.checkOut,
            status: v.status
          });

          const row = worksheet.getRow(rowNumber);
          row.height = 55;
          row.alignment = { vertical: "middle" };

          if (v.photo && v.photo.startsWith("data:image")) {
            try {
              const imageId = workbook.addImage({
                base64: v.photo,
                extension: "jpeg"
              });

                  <button 
                    onClick={() => setSelectedVisitorModal(null)}
                    className={`${selectedVisitorModal.status === 'Inside' ? 'w-1/2' : 'w-full'} py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-xs transition`}
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* HOST DELETE CONFIRMATION MODAL */}
          {hostDeleteConfirm && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-rose-500/40 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
                <div className="w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto mb-3 text-2xl font-bold">
                  🗑️
                </div>
                <h3 className="text-base font-bold text-white mb-2">Delete Host Personnel?</h3>
                <p className="text-xs text-slate-300 mb-6">
                  Are you sure you want to remove <strong className="text-white">{hostDeleteConfirm.name} ({hostDeleteConfirm.id})</strong> from the authorized host directory?
                </p>
                <div className="flex gap-3">
                  <button 
                    onClick={() => setHostDeleteConfirm(null)}
                    className="w-1/2 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold"
                  >
                    No, Cancel
                  </button>
                  <button 
                    onClick={() => deleteHost(hostDeleteConfirm.id)}
                    className="w-1/2 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold transition shadow-lg"
                  >
                    Yes, Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Entrance Standee QR Modal */}
          {standeeModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl relative">
                <button 
                  onClick={() => setStandeeModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg font-bold"
                >
                  ✕
                </button>
                <div className="flex justify-center mb-4">
                  <VistaLogo className="h-10" />
                </div>
                <h3 className="text-base font-bold text-white">VISTA Engg Solutions Pvt Ltd</h3>
                <p className="text-xs text-cyan-400 mb-4">Security Gate Registration Standee</p>
                
                <div className="bg-white p-3 rounded-xl inline-block shadow-inner mb-4">
                  <canvas ref={standeeQrRef}></canvas>
                </div>

                <p className="text-xs text-slate-400 mb-4">Scan using phone camera at reception or gate to self-register.</p>
                <button 
                  onClick={() => window.print()}
                  className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl text-xs border border-slate-700"
                >
                  Print Standee
                </button>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-800/80 py-3 px-6 flex items-center justify-between text-xs text-slate-500">
            <div>© 2026 VISTA Engg Solutions Private Limited. All Rights Reserved.</div>
            <div>
              <button 
                onClick={() => setView('staff')} 
                title="Staff Portal Login"
                className="hover:text-slate-300 transition"
              >
                🔒 Staff Access
              </button>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
